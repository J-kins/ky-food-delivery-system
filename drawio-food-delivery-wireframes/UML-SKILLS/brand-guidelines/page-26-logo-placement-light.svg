  <text id="r1" x="72" y="520" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#6B6B6B" text-anchor="start">&#x2022;  Position logo in the top-left corner for all documents and stationery</text>
  <text id="r2" x="72" y="538" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#6B6B6B" text-anchor="start">&#x2022;  Centre logo on packaging, promotional, and signage materials</text>
  <text id="r3" x="72" y="556" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#6B6B6B" text-anchor="start">&#x2022;  Maintain minimum clear space equal to the height of the mark</text>
  <text id="r4" x="72" y="574" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#6B6B6B" text-anchor="start">&#x2022;  Never rotate, stretch, recolour, or alter the logo</text>
