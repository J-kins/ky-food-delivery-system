<svg viewBox="0 0 860 910" xmlns="http://www.w3.org/2000/svg">
<title>Shape and Diagram Style Specimen Sheet</title>
<desc>General SVG design guideline applied to sample shapes from the shape/diagram-type library, in light and dark mode.</desc>
<style>
  text { font-family: Helvetica, Arial, sans-serif; }
  .shape-l { fill: #E5E5E5; stroke: #1A1A1A; stroke-width: 1.5; }
  .shape-d { fill: #1E1E1E; stroke: #F2F2F2; stroke-width: 1.5; }
  .line-l { stroke: #1A1A1A; stroke-width: 2; fill: none; }
  .line-d { stroke: #F2F2F2; stroke-width: 2; fill: none; }
  .thin-l { stroke: #1A1A1A; stroke-width: 1.5; }
  .thin-d { stroke: #F2F2F2; stroke-width: 1.5; }
  .div-l { stroke: #1A1A1A; stroke-width: 1; }
  .div-d { stroke: #F2F2F2; stroke-width: 1; }
  .arrow-l { fill: #1A1A1A; }
  .arrow-d { fill: #F2F2F2; }
  .lbl-l { font-size: 12px; fill: #1A1A1A; text-anchor: middle; }
  .lbl-d { font-size: 12px; fill: #F2F2F2; text-anchor: middle; }
  .lbls-l { font-size: 10px; fill: #1A1A1A; text-anchor: middle; font-weight: 600; }
  .lbls-d { font-size: 10px; fill: #F2F2F2; text-anchor: middle; font-weight: 600; }
  .micro-l { font-size: 8px; fill: #1A1A1A; }
  .micro-d { font-size: 8px; fill: #F2F2F2; }
  .cap-l { font-size: 10.5px; fill: #8A8A85; text-anchor: middle; letter-spacing: 0.3px; }
  .cap-d { font-size: 10.5px; fill: #8A8A85; text-anchor: middle; letter-spacing: 0.3px; }
  .h-l { font-size: 18px; fill: #1A1A1A; font-weight: 600; }
  .h-d { font-size: 18px; fill: #F2F2F2; font-weight: 600; }
  .sub-l { font-size: 11px; fill: #8A8A85; }
  .sub-d { font-size: 11px; fill: #8A8A85; }
</style>

<!-- LIGHT MODE PANEL -->
<g>
  <rect x="0" y="0" width="860" height="440" rx="16" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text class="h-l" x="40" y="35">Shape &amp; Diagram Style — Light Mode</text>
  <text class="sub-l" x="40" y="52">Palette, radius, and stroke rules applied to sample shapes from the library</text>

  <g transform="translate(40,80)">
    <rect class="shape-l" x="20" y="15" width="100" height="50" rx="25"/>
    <text class="lbl-l" x="70" y="45">Start</text>
    <text class="cap-l" x="70" y="100">Terminator</text>
  </g>

  <g transform="translate(200,80)">
    <rect class="shape-l" x="20" y="15" width="100" height="50" rx="8"/>
    <text class="lbl-l" x="70" y="45">Process</text>
    <text class="cap-l" x="70" y="100">Process</text>
  </g>

  <g transform="translate(360,80)">
    <polygon class="shape-l" points="70,13 120,45 70,77 20,45"/>
    <text class="lbls-l" x="70" y="48">Valid?</text>
    <text class="cap-l" x="70" y="100">Decision</text>
  </g>

  <g transform="translate(520,80)">
    <rect x="25" y="20" width="90" height="40" fill="#E5E5E5"/>
    <line class="thin-l" x1="25" y1="20" x2="25" y2="60"/>
    <line class="thin-l" x1="115" y1="20" x2="115" y2="60"/>
    <ellipse class="shape-l" cx="70" cy="60" rx="45" ry="10"/>
    <ellipse class="shape-l" cx="70" cy="20" rx="45" ry="10"/>
    <text class="lbls-l" x="70" y="52">Data</text>
    <text class="cap-l" x="70" y="100">Data Store</text>
  </g>

  <g transform="translate(680,80)">
    <line class="line-l" x1="20" y1="45" x2="105" y2="45"/>
    <polygon class="arrow-l" points="105,38 121,45 105,52"/>
    <text class="cap-l" x="70" y="100">Connector</text>
  </g>

  <g transform="translate(40,260)">
    <rect class="shape-l" x="15" y="8" width="110" height="70" rx="6"/>
    <line class="div-l" x1="15" y1="31" x2="125" y2="31"/>
    <line class="div-l" x1="15" y1="54" x2="125" y2="54"/>
    <text class="lbls-l" x="70" y="23">ClassName</text>
    <text class="micro-l" x="22" y="45">+ field: Type</text>
    <text class="micro-l" x="22" y="68">+ method()</text>
    <text class="cap-l" x="70" y="100">Class</text>
  </g>

  <g transform="translate(200,260)">
    <circle class="shape-l" cx="70" cy="18" r="8"/>
    <line class="line-l" x1="70" y1="26" x2="70" y2="52"/>
    <line class="line-l" x1="52" y1="34" x2="88" y2="34"/>
    <line class="line-l" x1="70" y1="52" x2="54" y2="75"/>
    <line class="line-l" x1="70" y1="52" x2="86" y2="75"/>
    <text class="cap-l" x="70" y="100">Actor</text>
  </g>

  <g transform="translate(360,260)">
    <rect class="shape-l" x="15" y="15" width="110" height="50" rx="6"/>
    <text class="lbl-l" x="70" y="45">Customer</text>
    <text class="cap-l" x="70" y="100">Entity</text>
  </g>

  <g transform="translate(520,260)">
    <polygon class="shape-l" points="70,13 120,45 70,77 20,45"/>
    <line class="thin-l" x1="55" y1="32" x2="85" y2="58"/>
    <line class="thin-l" x1="85" y1="32" x2="55" y2="58"/>
    <text class="cap-l" x="70" y="100">Gateway</text>
  </g>

  <g transform="translate(680,260)">
    <circle class="shape-l" cx="70" cy="45" r="32"/>
    <text class="cap-l" x="70" y="100">Event</text>
  </g>
</g>

<!-- DARK MODE PANEL -->
<g transform="translate(0,470)">
  <rect x="0" y="0" width="860" height="440" rx="16" fill="#0D0D0D" stroke="#2A2A2A"/>
  <text class="h-d" x="40" y="35">Shape &amp; Diagram Style — Dark Mode</text>
  <text class="sub-d" x="40" y="52">Same rules, dark-mode tokens swapped in</text>

  <g transform="translate(40,80)">
    <rect class="shape-d" x="20" y="15" width="100" height="50" rx="25"/>
    <text class="lbl-d" x="70" y="45">Start</text>
    <text class="cap-d" x="70" y="100">Terminator</text>
  </g>

  <g transform="translate(200,80)">
    <rect class="shape-d" x="20" y="15" width="100" height="50" rx="8"/>
    <text class="lbl-d" x="70" y="45">Process</text>
    <text class="cap-d" x="70" y="100">Process</text>
  </g>

  <g transform="translate(360,80)">
    <polygon class="shape-d" points="70,13 120,45 70,77 20,45"/>
    <text class="lbls-d" x="70" y="48">Valid?</text>
    <text class="cap-d" x="70" y="100">Decision</text>
  </g>

  <g transform="translate(520,80)">
    <rect x="25" y="20" width="90" height="40" fill="#1E1E1E"/>
    <line class="thin-d" x1="25" y1="20" x2="25" y2="60"/>
    <line class="thin-d" x1="115" y1="20" x2="115" y2="60"/>
    <ellipse class="shape-d" cx="70" cy="60" rx="45" ry="10"/>
    <ellipse class="shape-d" cx="70" cy="20" rx="45" ry="10"/>
    <text class="lbls-d" x="70" y="52">Data</text>
    <text class="cap-d" x="70" y="100">Data Store</text>
  </g>

  <g transform="translate(680,80)">
    <line class="line-d" x1="20" y1="45" x2="105" y2="45"/>
    <polygon class="arrow-d" points="105,38 121,45 105,52"/>
    <text class="cap-d" x="70" y="100">Connector</text>
  </g>

  <g transform="translate(40,260)">
    <rect class="shape-d" x="15" y="8" width="110" height="70" rx="6"/>
    <line class="div-d" x1="15" y1="31" x2="125" y2="31"/>
    <line class="div-d" x1="15" y1="54" x2="125" y2="54"/>
    <text class="lbls-d" x="70" y="23">ClassName</text>
    <text class="micro-d" x="22" y="45">+ field: Type</text>
    <text class="micro-d" x="22" y="68">+ method()</text>
    <text class="cap-d" x="70" y="100">Class</text>
  </g>

  <g transform="translate(200,260)">
    <circle class="shape-d" cx="70" cy="18" r="8"/>
    <line class="line-d" x1="70" y1="26" x2="70" y2="52"/>
    <line class="line-d" x1="52" y1="34" x2="88" y2="34"/>
    <line class="line-d" x1="70" y1="52" x2="54" y2="75"/>
    <line class="line-d" x1="70" y1="52" x2="86" y2="75"/>
    <text class="cap-d" x="70" y="100">Actor</text>
  </g>

  <g transform="translate(360,260)">
    <rect class="shape-d" x="15" y="15" width="110" height="50" rx="6"/>
    <text class="lbl-d" x="70" y="45">Customer</text>
    <text class="cap-d" x="70" y="100">Entity</text>
  </g>

  <g transform="translate(520,260)">
    <polygon class="shape-d" points="70,13 120,45 70,77 20,45"/>
    <line class="thin-d" x1="55" y1="32" x2="85" y2="58"/>
    <line class="thin-d" x1="85" y1="32" x2="55" y2="58"/>
    <text class="cap-d" x="70" y="100">Gateway</text>
  </g>

  <g transform="translate(680,260)">
    <circle class="shape-d" cx="70" cy="45" r="32"/>
    <text class="cap-d" x="70" y="100">Event</text>
  </g>
</g>

</svg>
