  <path id="c1a" d="M 174,475.2 L 182,480 L 174,484.8" stroke="#1A1A1A" fill="none" stroke-width="1.5"/>
  <text id="cm1" x="222" y="484" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#1A1A1A" text-anchor="start">Async message / directed association</text>
  <line id="c2l" x1="72" y1="536" x2="174" y2="536" stroke="#1A1A1A" stroke-width="2" stroke-dasharray="5,4"/>
  <path id="c2a" d="M 174,531.2 L 182,536 L 174,540.8" stroke="#1A1A1A" fill="none" stroke-width="1.5"/>
