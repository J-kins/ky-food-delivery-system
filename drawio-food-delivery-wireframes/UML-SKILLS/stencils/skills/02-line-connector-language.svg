  <line id="c4l" x1="642" y1="424" x2="738" y2="424" stroke="#1A1A1A" stroke-width="2"/>
  <polygon id="c4a" points="752,416.8 764,424 752,431.2" fill="none" stroke="#1A1A1A" stroke-width="1.3"/>
  <text id="cm4" x="792" y="428" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#1A1A1A" text-anchor="start">Generalization / inheritance</text>
  <line id="c5l" x1="642" y1="480" x2="738" y2="480" stroke="#1A1A1A" stroke-width="2"/>
  <polygon id="c5a" points="735,480 744,474.15 753,480 744,485.85" fill="none" stroke="#1A1A1A" stroke-width="1.2"/>
  <text id="cm5" x="792" y="484" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#1A1A1A" text-anchor="start">Aggregation</text>
  <line id="c6l" x1="642" y1="536" x2="738" y2="536" stroke="#1A1A1A" stroke-width="2"/>
  <polygon id="c6a" points="735,536 744,530.15 753,536 744,541.85" fill="#1A1A1A"/>
  <text id="cm6" x="792" y="540" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#1A1A1A" text-anchor="start">Composition</text>
