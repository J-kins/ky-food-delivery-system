  <line id="c3l" x1="72" y1="592" x2="168" y2="592" stroke="#1A1A1A" stroke-width="2" stroke-dasharray="5,4"/>
  <polygon id="c3a" points="182,584.8 194,592 182,599.2" fill="none" stroke="#1A1A1A" stroke-width="1.3"/>
