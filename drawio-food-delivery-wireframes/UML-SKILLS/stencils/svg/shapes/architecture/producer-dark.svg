<svg viewBox="0 0 140 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Producer shape: rounded rect with output arrow -->
  <defs>
    <style>
      .arch-fill { fill: #1E1E1E; }
      .arch-stroke { stroke: #F2F2F2; stroke-width: 1.5; }
    </style>
  </defs>
  <!-- Main container -->
  <rect x="20" y="30" width="70" height="40" rx="6" class="arch-fill arch-stroke"/>
  <!-- Output arrow -->
  <polygon points="90,50 110,45 110,55" class="arch-fill arch-stroke"/>
  <line x1="90" y1="50" x2="110" y2="50" class="arch-stroke"/>
  <!-- Producer indicator -->
  <circle cx="40" cy="50" r="4" class="arch-fill arch-stroke"/>
</svg>
