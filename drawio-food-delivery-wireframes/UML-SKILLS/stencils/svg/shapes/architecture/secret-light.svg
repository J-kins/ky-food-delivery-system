<svg viewBox="0 0 140 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Secret shape: locked document -->
  <defs>
    <style>
      .arch-fill { fill: #E5E5E5; }
      .arch-stroke { stroke: #1A1A1A; stroke-width: 1.5; }
    </style>
  </defs>
  <!-- Document body -->
  <rect x="30" y="30" width="60" height="50" rx="4" class="arch-fill arch-stroke"/>
  <!-- Lock icon -->
  <rect x="50" y="40" width="20" height="15" rx="3" class="arch-fill arch-stroke"/>
  <!-- Lock shackle -->
  <path d="M 55 40 Q 55 30 70 30 Q 70 40 70 40" class="arch-stroke" fill="none"/>
  <!-- Lock dot -->
  <circle cx="60" cy="50" r="2" class="arch-fill arch-stroke"/>
</svg>
