<svg viewBox="0 0 140 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Persistent Volume shape: stacked storage blocks -->
  <defs>
    <style>
      .arch-fill { fill: #1E1E1E; }
      .arch-stroke { stroke: #F2F2F2; stroke-width: 1.5; }
    </style>
  </defs>
  <!-- Storage blocks -->
  <rect x="25" y="20" width="80" height="20" class="arch-fill arch-stroke"/>
  <rect x="30" y="40" width="80" height="20" class="arch-fill arch-stroke"/>
  <rect x="35" y="60" width="80" height="20" class="arch-fill arch-stroke"/>
</svg>
