<svg viewBox="0 0 140 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Container shape: simple rounded rectangle -->
  <defs>
    <style>
      .arch-fill { fill: #1E1E1E; }
      .arch-stroke { stroke: #F2F2F2; stroke-width: 1.5; }
    </style>
  </defs>
  <!-- Main container -->
  <rect x="20" y="20" width="100" height="60" rx="8" class="arch-fill arch-stroke"/>
  <!-- Container accent lines -->
  <line x1="20" y1="35" x2="120" y2="35" class="arch-stroke"/>
  <line x1="20" y1="50" x2="120" y2="50" class="arch-stroke"/>
  <line x1="20" y1="65" x2="120" y2="65" class="arch-stroke"/>
</svg>
