<svg viewBox="0 0 140 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Microservice shape: rounded rectangle with service indicator -->
  <defs>
    <style>
      .arch-fill { fill: #E5E5E5; }
      .arch-stroke { stroke: #1A1A1A; stroke-width: 1.5; }
    </style>
  </defs>
  <!-- Main container -->
  <rect x="20" y="20" width="100" height="60" rx="8" class="arch-fill arch-stroke"/>
  <!-- Service indicator circle -->
  <circle cx="35" cy="35" r="5" class="arch-fill arch-stroke"/>
  <!-- Service lines -->
  <line x1="50" y1="35" x2="120" y2="35" class="arch-stroke"/>
  <line x1="50" y1="50" x2="120" y2="50" class="arch-stroke"/>
  <line x1="50" y1="65" x2="120" y2="65" class="arch-stroke"/>
</svg>
