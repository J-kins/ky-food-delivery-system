<svg viewBox="0 0 140 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Pod shape: rectangle with distinctive pod styling -->
  <defs>
    <style>
      .arch-fill { fill: #1E1E1E; }
      .arch-stroke { stroke: #F2F2F2; stroke-width: 1.5; }
    </style>
  </defs>
  <!-- Main pod body -->
  <rect x="20" y="25" width="100" height="50" rx="6" class="arch-fill arch-stroke"/>
  <!-- Pod internal structure -->
  <circle cx="40" cy="50" r="6" class="arch-fill arch-stroke"/>
  <circle cx="70" cy="50" r="6" class="arch-fill arch-stroke"/>
  <circle cx="100" cy="50" r="6" class="arch-fill arch-stroke"/>
  <!-- Connecting lines -->
  <line x1="45" y1="50" x2="65" y2="50" class="arch-stroke"/>
  <line x1="75" y1="50" x2="95" y2="50" class="arch-stroke"/>
</svg>
