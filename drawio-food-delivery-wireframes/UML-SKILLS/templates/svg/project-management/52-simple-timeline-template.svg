<?XML version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <script type="application/json" id="timeline-data">
  {
    "metadata": {"title": "Timeline", "projectName": "Food Delivery System", "description": "Simple linear timeline of events or milestones", "version": "1.0", "mode": "light"},
    "config": {"layout": {"canvasWidth": 1920, "canvasHeight": 1080}, "styling": {"mode": "light", "canvasColor": "#FFFFFF", "fillColor": "#FFFFFF", "strokeColor": "#334155"}},
    "data": {
      "events": [
        {"id": "e1", "label": "Phase 1", "x": 300, "date": "Q1 2024"},
        {"id": "e2", "label": "Phase 2", "x": 700, "date": "Q2 2024"},
        {"id": "e3", "label": "Phase 3", "x": 1100, "date": "Q3 2024"},
        {"id": "e4", "label": "Phase 4", "x": 1500, "date": "Q4 2024"}
      ],
      "axis": {"x": 250, "y": 450, "width": 1400}
    }
  }
  </script>
  <defs>
    <style>
      :root { --fill-light: #FFFFFF; --stroke-light: #334155; --text-light: #334155; --muted-light: #64748b; }
      text { font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif; }
      .event-node { fill: var(--fill-light); stroke: var(--stroke-light); stroke-width: 2; }
      .label-primary { fill: var(--text-light); font-size: 12px; font-weight: 600; }
      .label-secondary { fill: var(--muted-light); font-size: 10px; }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect x="40" y="40" width="1840" height="1000" rx="8" fill="#FFFFFF" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="680" y="52" width="560" height="56" rx="6" fill="#3B82F6"/>
  <text x="960" y="88" text-anchor="middle" fill="#FFFFFF" class="label-primary" font-size="22">Timeline</text>
  <text x="960" y="108" text-anchor="middle" fill="#EFF6FF" class="label-secondary" font-size="12">&lt;Project Name&gt; · Template</text>
  
  <!-- Timeline axis -->
  <line x1="250" y1="450" x2="1650" y2="450" stroke="#334155" stroke-width="2"/>
  
  <!-- Event 1 -->
  <circle cx="300" cy="450" r="12" class="event-node"/>
  <rect x="250" y="300" width="100" height="100" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1"/>
  <text x="300" y="340" text-anchor="middle" class="label-primary">Phase 1</text>
  <text x="300" y="365" text-anchor="middle" class="label-secondary">Q1 2024</text>
  <line x1="300" y1="438" x2="300" y2="400" stroke="#334155" stroke-width="1"/>
  
  <!-- Event 2 -->
  <circle cx="700" cy="450" r="12" class="event-node"/>
  <rect x="650" y="300" width="100" height="100" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1"/>
  <text x="700" y="340" text-anchor="middle" class="label-primary">Phase 2</text>
  <text x="700" y="365" text-anchor="middle" class="label-secondary">Q2 2024</text>
  <line x1="700" y1="438" x2="700" y2="400" stroke="#334155" stroke-width="1"/>
  
  <!-- Event 3 -->
  <circle cx="1100" cy="450" r="12" class="event-node"/>
  <rect x="1050" y="300" width="100" height="100" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1"/>
  <text x="1100" y="340" text-anchor="middle" class="label-primary">Phase 3</text>
  <text x="1100" y="365" text-anchor="middle" class="label-secondary">Q3 2024</text>
  <line x1="1100" y1="438" x2="1100" y2="400" stroke="#334155" stroke-width="1"/>
  
  <!-- Event 4 -->
  <circle cx="1500" cy="450" r="12" class="event-node"/>
  <rect x="1450" y="300" width="100" height="100" rx="4" fill="#E0F2FE" stroke="#0284C7" stroke-width="1"/>
  <text x="1500" y="340" text-anchor="middle" class="label-primary">Phase 4</text>
  <text x="1500" y="365" text-anchor="middle" class="label-secondary">Q4 2024</text>
  <line x1="1500" y1="438" x2="1500" y2="400" stroke="#334155" stroke-width="1"/>
  
  <text x="52" y="1048" class="label-secondary" font-size="10">Page 1 of 1 · CONFIDENTIAL — Internal Use Only</text>
  <text x="1868" y="1048" text-anchor="end" class="label-secondary" font-size="10">&lt;Project Name&gt; · Version 1.0 · Timeline</text>
  <script type="text/javascript">
  (function() {
    const dataElement = document.currentScript.closest('svg').querySelector('#timeline-data');
    if (!dataElement) return;
    try {
      const data = JSON.parse(dataElement.textContent);
      console.log('[Timeline Data] Loaded:', data.metadata.title);
    } catch (e) {
      console.error('[Timeline] Invalid JSON:', e.message);
    }
  })();
  </script>
</svg>
