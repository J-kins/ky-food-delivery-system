      ]
    }
  }
  </script>
  <defs>
    <style>
      :root { --fill-light: #FFFFFF; --stroke-light: #334155; --text-light: #334155; --muted-light: #64748b; --exec-bg: #3B82F6; --dir-bg: #60A5FA; --mgr-bg: #93C5FD; }
      text { font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif; }
      .exec-box { fill: var(--exec-bg); stroke: var(--stroke-light); stroke-width: 2; }
      .dir-box { fill: var(--dir-bg); stroke: var(--stroke-light); stroke-width: 1.5; }
      .mgr-box { fill: var(--mgr-bg); stroke: var(--stroke-light); stroke-width: 1.5; }
      .label-primary { fill: white; font-size: 11px; font-weight: 600; }
      .label-secondary { fill: rgba(255,255,255,0.9); font-size: 10px; }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect x="40" y="40" width="1840" height="1000" rx="8" fill="#FFFFFF" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="600" y="52" width="720" height="56" rx="6" fill="#3B82F6"/>
  <text x="960" y="88" text-anchor="middle" fill="#FFFFFF" class="label-primary" font-size="22">Organization Chart</text>
  <text x="960" y="108" text-anchor="middle" fill="#EFF6FF" class="label-secondary" font-size="12">&lt;Project Name&gt; · Template</text>
  
