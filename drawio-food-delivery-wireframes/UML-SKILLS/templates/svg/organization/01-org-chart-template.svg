  <text x="450" y="398" text-anchor="middle" class="label-secondary">Operations</text>
  
  <rect x="850" y="350" width="200" height="80" rx="6" class="dir-box"/>
  <text x="950" y="380" text-anchor="middle" class="label-primary">Director - Dev</text>
  <text x="950" y="398" text-anchor="middle" class="label-secondary">Development</text>
  
  <rect x="1350" y="350" width="200" height="80" rx="6" class="dir-box"/>
  <text x="1450" y="380" text-anchor="middle" class="label-primary">Director - Sales</text>
  <text x="1450" y="398" text-anchor="middle" class="label-secondary">Sales</text>
  
