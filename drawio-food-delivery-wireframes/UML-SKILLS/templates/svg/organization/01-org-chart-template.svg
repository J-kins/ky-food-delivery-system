  <line x1="960" y1="230" x2="450" y2="350" stroke="#334155" stroke-width="1.5"/>
  <line x1="960" y1="230" x2="950" y2="350" stroke="#334155" stroke-width="1.5"/>
  <line x1="960" y1="230" x2="1450" y2="350" stroke="#334155" stroke-width="1.5"/>
  
  <line x1="450" y1="430" x2="290" y2="550" stroke="#334155" stroke-width="1.5"/>
