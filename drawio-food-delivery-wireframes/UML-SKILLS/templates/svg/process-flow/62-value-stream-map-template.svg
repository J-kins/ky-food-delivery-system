  <rect x="40" y="118" width="1840" height="882" fill="url(#grid-vsm)"/>
  <rect x="40" y="118" width="1840" height="882" fill="#FFFFFF" fill-opacity="1"/>

  <rect x="100" y="250" width="200" height="150" rx="8" class="vsm-box"/>
  <text x="200" y="330" text-anchor="middle" class="label-primary">Supplier</text>

  <line x1="300" y1="325" x2="450" y2="325" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow-vsm)"/>

  <rect x="450" y="300" width="250" height="200" rx="8" class="vsm-box"/>
  <text x="575" y="400" text-anchor="middle" class="label-primary">Process 1</text>

  <line x1="700" y1="400" x2="900" y2="400" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow-vsm)"/>

  <rect x="900" y="300" width="250" height="200" rx="8" class="vsm-box"/>
  <text x="1025" y="400" text-anchor="middle" class="label-primary">Process 2</text>

  <line x1="1150" y1="400" x2="1350" y2="400" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow-vsm)"/>

