  <script type="text/javascript">
  (function() {
    const dataElement = document.currentScript.closest('svg').querySelector('#value-stream-map-data');
    if (!dataElement) return;
    try {
      const data = JSON.parse(dataElement.textContent);
      console.log('[Value Stream Map Data] Loaded:', data.metadata.title);
    } catch (e) {
      console.error('[Value Stream Map] Invalid JSON:', e.message);
    }
  })();
  </script>
