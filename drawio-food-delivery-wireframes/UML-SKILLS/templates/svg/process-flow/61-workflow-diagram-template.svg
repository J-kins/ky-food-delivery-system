<?XML version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <script type="application/json" id="workflow-diagram-data">
  {
    "metadata": {"title": "Workflow Diagram", "projectName": "Food Delivery System", "description": "Workflow states and transitions", "version": "1.0", "mode": "light"},
    "config": {"layout": {"canvasWidth": 1920, "canvasHeight": 1080}, "styling": {"mode": "light", "canvasColor": "#FFFFFF", "fillColor": "#E5E5E5", "strokeColor": "#1A1A1A"}},
    "data": {
      "states": [
        {"id": "state1", "name": "State 1", "x": 250, "y": 350, "width": 180, "height": 120},
        {"id": "state2", "name": "State 2", "x": 650, "y": 350, "width": 180, "height": 120},
        {"id": "state3", "name": "State 3", "x": 1050, "y": 350, "width": 180, "height": 120},
        {"id": "state4", "name": "State 4", "x": 1450, "y": 350, "width": 180, "height": 120}
      ],
      "transitions": [
        {"from": "state1", "to": "state2"},
        {"from": "state2", "to": "state3"},
        {"from": "state3", "to": "state4"}
      ]
    }
  }
  </script>

  <defs>
    <style>
      :root { --canvas-light: #FFFFFF; --fill-light: #E5E5E5; --stroke-light: #1A1A1A; --text-light: #1A1A1A; --muted-light: #8A8A85; }
      text { font-family: Helvetica, Arial, sans-serif; }
      .state-box { fill: var(--fill-light); stroke: var(--stroke-light); stroke-width: 1.5; }
      .label-primary { fill: var(--text-light); font-size: 12px; font-weight: 500; }
      .label-secondary { fill: var(--muted-light); font-size: 9px; font-weight: 400; }
    </style>
    <marker id="arrow-workflow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1A1A1A"/>
    </marker>
    <pattern id="grid-workflow" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1A1A1A" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect x="40" y="40" width="1840" height="1000" rx="8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  
  <rect x="580" y="52" width="760" height="56" rx="8" fill="#E5E5E5" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="960" y="88" text-anchor="middle" class="label-primary" font-size="22">Workflow Diagram</text>
  <text x="960" y="108" text-anchor="middle" class="label-secondary">&lt;Project Name&gt; · Template</text>

  <rect x="40" y="118" width="1840" height="882" fill="url(#grid-workflow)"/>
  <rect x="40" y="118" width="1840" height="882" fill="#FFFFFF" fill-opacity="1"/>

  <rect x="250" y="350" width="180" height="120" rx="8" class="state-box"/>
  <text x="340" y="410" text-anchor="middle" class="label-primary">State 1</text>

  <line x1="430" y1="410" x2="650" y2="410" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow-workflow)"/>

  <rect x="650" y="350" width="180" height="120" rx="8" class="state-box"/>
  <text x="740" y="410" text-anchor="middle" class="label-primary">State 2</text>

  <line x1="830" y1="410" x2="1050" y2="410" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow-workflow)"/>

  <rect x="1050" y="350" width="180" height="120" rx="8" class="state-box"/>
  <text x="1140" y="410" text-anchor="middle" class="label-primary">State 3</text>

  <line x1="1230" y1="410" x2="1450" y2="410" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow-workflow)"/>

  <rect x="1450" y="350" width="180" height="120" rx="8" class="state-box"/>
  <text x="1540" y="410" text-anchor="middle" class="label-primary">State 4</text>

  <text x="52" y="1048" class="label-secondary">Page 1 of 1 · CONFIDENTIAL — Internal Use Only</text>
  <text x="1868" y="1048" text-anchor="end" class="label-secondary">&lt;Project Name&gt; · Version 1.0 · Workflow Diagram</text>

  <script type="text/javascript">
  (function() {
    const dataElement = document.currentScript.closest('svg').querySelector('#workflow-diagram-data');
    if (!dataElement) return;
    try {
      const data = JSON.parse(dataElement.textContent);
      console.log('[Workflow Diagram Data] Loaded:', data.metadata.title);
    } catch (e) {
      console.error('[Workflow Diagram] Invalid JSON:', e.message);
    }
  })();
  </script>
</svg>
