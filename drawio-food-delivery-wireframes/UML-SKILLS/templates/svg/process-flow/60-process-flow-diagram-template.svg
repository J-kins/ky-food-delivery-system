<?XML version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <script type="application/json" id="process-flow-data">
  {
    "metadata": {"title": "Process Flow Diagram", "projectName": "Food Delivery System", "description": "Sequential process flow with decision points", "version": "1.0", "mode": "light"},
    "config": {"layout": {"canvasWidth": 1920, "canvasHeight": 1080}, "styling": {"mode": "light", "canvasColor": "#FFFFFF", "fillColor": "#E5E5E5", "strokeColor": "#1A1A1A"}},
    "data": {
      "steps": [
        {"id": "start", "name": "Start", "type": "start", "x": 150, "y": 380, "width": 120, "height": 80},
        {"id": "process1", "name": "Process", "type": "process", "x": 400, "y": 350, "width": 200, "height": 140},
        {"id": "decision", "name": "Decision", "type": "decision", "x": 750, "y": 380, "width": 100, "height": 80},
        {"id": "process2", "name": "Process", "type": "process", "x": 1000, "y": 350, "width": 200, "height": 140},
        {"id": "end", "name": "End", "type": "end", "x": 1350, "y": 380, "width": 120, "height": 80}
      ]
    }
  }
  </script>

  <defs>
    <style>
      :root { --canvas-light: #FFFFFF; --fill-light: #E5E5E5; --stroke-light: #1A1A1A; --text-light: #1A1A1A; --muted-light: #8A8A85; }
      text { font-family: Helvetica, Arial, sans-serif; }
      .step-box { fill: var(--fill-light); stroke: var(--stroke-light); stroke-width: 1.5; }
      .label-primary { fill: var(--text-light); font-size: 12px; font-weight: 500; }
      .label-secondary { fill: var(--muted-light); font-size: 9px; font-weight: 400; }
    </style>
    <marker id="arrow-flow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1A1A1A"/>
    </marker>
    <pattern id="grid-pfd" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1A1A1A" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect x="40" y="40" width="1840" height="1000" rx="8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  
  <rect x="520" y="52" width="880" height="56" rx="8" fill="#E5E5E5" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="960" y="88" text-anchor="middle" class="label-primary" font-size="22">Process Flow Diagram</text>
  <text x="960" y="108" text-anchor="middle" class="label-secondary">&lt;Project Name&gt; · Template</text>

  <rect x="40" y="118" width="1840" height="882" fill="url(#grid-pfd)"/>
  <rect x="40" y="118" width="1840" height="882" fill="#FFFFFF" fill-opacity="1"/>

  <circle cx="210" cy="420" r="40" class="step-box"/>
  <text x="210" y="425" text-anchor="middle" class="label-primary">Start</text>

  <rect x="400" y="350" width="200" height="140" rx="8" class="step-box"/>
  <text x="500" y="420" text-anchor="middle" class="label-primary">Process</text>

  <line x1="270" y1="420" x2="400" y2="420" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow-flow)"/>

  <path d="M 750 380 L 800 420 L 750 460 L 700 420 Z" class="step-box"/>
  <text x="750" y="425" text-anchor="middle" class="label-primary">Decision</text>

  <line x1="600" y1="420" x2="700" y2="420" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow-flow)"/>

  <rect x="1000" y="350" width="200" height="140" rx="8" class="step-box"/>
  <text x="1100" y="420" text-anchor="middle" class="label-primary">Process</text>

  <line x1="800" y1="420" x2="1000" y2="420" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow-flow)"/>

  <circle cx="1410" cy="420" r="40" class="step-box"/>
  <text x="1410" y="425" text-anchor="middle" class="label-primary">End</text>

  <line x1="1200" y1="420" x2="1370" y2="420" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow-flow)"/>

  <text x="52" y="1048" class="label-secondary">Page 1 of 1 · CONFIDENTIAL — Internal Use Only</text>
  <text x="1868" y="1048" text-anchor="end" class="label-secondary">&lt;Project Name&gt; · Version 1.0 · Process Flow Diagram</text>

  <script type="text/javascript">
  (function() {
    const dataElement = document.currentScript.closest('svg').querySelector('#process-flow-data');
    if (!dataElement) return;
    try {
      const data = JSON.parse(dataElement.textContent);
      console.log('[Process Flow Data] Loaded:', data.metadata.title);
    } catch (e) {
      console.error('[Process Flow] Invalid JSON:', e.message);
    }
  })();
  </script>
</svg>
