<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <script type="application/json" id="serverless-data">
  {
    "metadata": {"title": "Serverless Architecture", "projectName": "Food Delivery System", "description": "Event-driven serverless infrastructure", "version": "1.0", "mode": "light"},
    "config": {"layout": {"canvasWidth": 1920, "canvasHeight": 1080}, "styling": {"mode": "light", "canvasColor": "#FFFFFF", "fillColor": "#E5E5E5", "strokeColor": "#1A1A1A"}},
    "data": {
      "layers": [
        {"id": "gateway", "name": "API Gateway", "x": 300, "y": 220, "width": 1200, "height": 200},
        {"id": "functions", "name": "Lambda Functions", "x": 300, "y": 460, "width": 550, "height": 240},
        {"id": "data", "name": "Data Services", "x": 920, "y": 460, "width": 580, "height": 240}
      ]
    }
  }
  </script>

  <defs>
    <style>
      :root { --canvas-light: #FFFFFF; --fill-light: #E5E5E5; --stroke-light: #1A1A1A; --text-light: #1A1A1A; --muted-light: #8A8A85; }
      text { font-family: Helvetica, Arial, sans-serif; }
      .service-box { fill: var(--fill-light); stroke: var(--stroke-light); stroke-width: 1.5; }
      .container-box { fill: none; stroke: var(--stroke-light); stroke-width: 1.5; }
      .label-primary { fill: var(--text-light); font-size: 12px; font-weight: 500; }
      .label-secondary { fill: var(--muted-light); font-size: 9px; font-weight: 400; }
    </style>
    <pattern id="grid-serverless" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1A1A1A" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect x="40" y="40" width="1840" height="1000" rx="8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  
  <rect x="520" y="52" width="880" height="56" rx="8" class="service-box"/>
  <text x="960" y="88" text-anchor="middle" class="label-primary" font-size="22">Serverless Architecture</text>
  <text x="960" y="108" text-anchor="middle" class="label-secondary">&lt;Project Name&gt; · Template</text>

  <rect x="40" y="118" width="1840" height="882" fill="url(#grid-serverless)"/>
  <rect x="40" y="118" width="1840" height="882" fill="#FFFFFF" fill-opacity="1"/>

  <rect x="300" y="220" width="1200" height="200" rx="8" class="service-box"/>
  <text x="900" y="325" text-anchor="middle" class="label-primary">API Gateway</text>

  <rect x="300" y="460" width="550" height="240" rx="8" class="container-box"/>
  <text x="310" y="480" class="label-primary">Lambda Functions</text>

  <rect x="920" y="460" width="580" height="240" rx="8" class="container-box"/>
  <text x="930" y="480" class="label-primary">Data Services</text>

  <rect x="1580" y="850" width="280" height="130" rx="8" class="service-box"/>
  <text x="1720" y="875" text-anchor="middle" class="label-primary">Legend</text>
  <rect x="1600" y="890" width="20" height="20" rx="4" class="service-box"/>
  <text x="1630" y="905" class="label-secondary">Serverless Service</text>
  <line x1="1600" y1="930" x2="1620" y2="930" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1630" y="935" class="label-secondary">Event Flow</text>

  <text x="52" y="1048" class="label-secondary">Page 1 of 1 · CONFIDENTIAL — Internal Use Only</text>
  <text x="1868" y="1048" text-anchor="end" class="label-secondary">&lt;Project Name&gt; · Version 1.0 · Serverless Architecture</text>

  <script type="text/javascript">
  (function() {
    const dataElement = document.currentScript.closest('svg').querySelector('#serverless-data');
    if (!dataElement) return;
    try {
      const data = JSON.parse(dataElement.textContent);
      console.log('[Serverless Architecture Data] Loaded:', data.metadata.title);
    } catch (e) {
      console.error('[Serverless Architecture] Invalid JSON:', e.message);
    }
  })();
  </script>
</svg>
