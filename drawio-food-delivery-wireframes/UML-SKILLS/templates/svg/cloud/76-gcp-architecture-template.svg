<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <!-- Design Tokens (Light Mode - Default) -->
  <defs>
    <style>
      :root {
        --canvas-light: #FFFFFF;
        --fill-light: #E5E5E5;
        --stroke-light: #1A1A1A;
        --text-muted: #8A8A85;
        --connector: #1A1A1A;
      }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <!-- Main Border Container -->
  <rect x="40" y="40" width="1840" height="1000" rx="8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- Header Section -->
  <rect x="580" y="52" width="760" height="56" rx="8" fill="#E5E5E5" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="960" y="88" text-anchor="middle" fill="#1A1A1A" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="500">Google Cloud Platform Architecture</text>
  <text x="960" y="108" text-anchor="middle" fill="#8A8A85" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400">&lt;Project Name&gt; · Template</text>

  <!-- Content Grid Background -->
  <defs>
    <pattern id="grid-gcp-architecture" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1A1A1A" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  <rect x="40" y="118" width="1840" height="882" fill="url(#grid-gcp-architecture)"/>
  <rect x="40" y="118" width="1840" height="882" fill="#FFFFFF" fill-opacity="1"/>

  <!-- GCP Project Container -->
  <rect x="300" y="220" width="1200" height="720" rx="8" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="310" y="240" fill="#1A1A1A" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="500">GCP Project</text>

  <!-- Compute Section -->
  <rect x="420" y="360" width="220" height="120" rx="8" fill="#E5E5E5" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="530.0" y="425.0" text-anchor="middle" fill="#1A1A1A" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="500">Compute</text>

  <!-- Storage Section -->
  <rect x="760" y="360" width="220" height="120" rx="8" fill="#E5E5E5" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="870.0" y="425.0" text-anchor="middle" fill="#1A1A1A" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="500">Storage</text>

  <!-- Database Section -->
  <rect x="1100" y="360" width="220" height="120" rx="8" fill="#E5E5E5" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1210.0" y="425.0" text-anchor="middle" fill="#1A1A1A" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="500">Database</text>

  <!-- Legend Section -->
  <rect x="1580" y="850" width="280" height="130" rx="8" fill="#E5E5E5" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1720.0" y="920.0" text-anchor="middle" fill="#1A1A1A" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="500">Legend</text>

  <!-- Footer Information -->
  <text x="52" y="1048" fill="#8A8A85" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" letter-spacing="0.3px">Page 1 of 1 · CONFIDENTIAL — Internal Use Only</text>
  <text x="1868" y="1048" text-anchor="end" fill="#8A8A85" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" letter-spacing="0.3px">&lt;Project Name&gt; · Version 1.0 · GCP Architecture</text>
</svg>
