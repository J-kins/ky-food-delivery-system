<?XML version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <script type="application/json" id="cost-optimization-data">
  {
    "metadata": {"title": "Cloud Cost Optimization", "projectName": "Food Delivery System", "description": "Strategies for optimizing cloud infrastructure costs", "version": "1.0", "mode": "light"},
    "config": {"layout": {"canvasWidth": 1920, "canvasHeight": 1080}, "styling": {"mode": "light", "canvasColor": "#FFFFFF", "fillColor": "#E5E5E5", "strokeColor": "#1A1A1A"}},
    "data": {
      "phases": [
        {"id": "analysis", "name": "Cost Analysis", "x": 150, "y": 220, "width": 480, "height": 320},
        {"id": "optimization", "name": "Optimization", "x": 740, "y": 220, "width": 480, "height": 320},
        {"id": "monitoring", "name": "Monitoring", "x": 1330, "y": 220, "width": 480, "height": 320}
      ],
      "techniques": [
        {"id": "rightsizing", "name": "Right-sizing Instances"},
        {"id": "reserved", "name": "Reserved Instances"},
        {"id": "spot", "name": "Spot Instances"},
        {"id": "autoscaling", "name": "Auto-scaling"}
      ]
    }
  }
  </script>

  <defs>
    <style>
      :root { --canvas-light: #FFFFFF; --fill-light: #E5E5E5; --stroke-light: #1A1A1A; --text-light: #1A1A1A; --muted-light: #8A8A85; }
      text { font-family: Helvetica, Arial, sans-serif; }
      .service-box { fill: var(--fill-light); stroke: var(--stroke-light); stroke-width: 1.5; }
      .container-box { fill: none; stroke: var(--stroke-light); stroke-width: 1.5; }
      .label-primary { fill: var(--text-light); font-size: 12px; font-weight: 500; }
      .label-secondary { fill: var(--muted-light); font-size: 9px; font-weight: 400; }
    </style>
    <pattern id="grid-cost" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1A1A1A" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect x="40" y="40" width="1840" height="1000" rx="8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  
  <rect x="440" y="52" width="1040" height="56" rx="8" class="service-box"/>
  <text x="960" y="88" text-anchor="middle" class="label-primary" font-size="22">Cloud Cost Optimization</text>
  <text x="960" y="108" text-anchor="middle" class="label-secondary">&lt;Project Name&gt; · Template</text>

  <rect x="40" y="118" width="1840" height="882" fill="url(#grid-cost)"/>
  <rect x="40" y="118" width="1840" height="882" fill="#FFFFFF" fill-opacity="1"/>

  <rect x="150" y="220" width="480" height="320" rx="8" class="service-box"/>
  <text x="390" y="380" text-anchor="middle" class="label-primary">Cost Analysis</text>

  <rect x="740" y="220" width="480" height="320" rx="8" class="service-box"/>
  <text x="980" y="380" text-anchor="middle" class="label-primary">Optimization</text>

  <rect x="1330" y="220" width="480" height="320" rx="8" class="service-box"/>
  <text x="1570" y="380" text-anchor="middle" class="label-primary">Monitoring</text>

  <rect x="300" y="620" width="1320" height="280" rx="8" class="container-box"/>
  <text x="310" y="640" class="label-primary">Optimization Results</text>

  <text x="52" y="1048" class="label-secondary">Page 1 of 1 · CONFIDENTIAL — Internal Use Only</text>
  <text x="1868" y="1048" text-anchor="end" class="label-secondary">&lt;Project Name&gt; · Version 1.0 · Cloud Cost Optimization</text>

  <script type="text/javascript">
  (function() {
    const dataElement = document.currentScript.closest('svg').querySelector('#cost-optimization-data');
    if (!dataElement) return;
    try {
      const data = JSON.parse(dataElement.textContent);
      console.log('[Cloud Cost Optimization Data] Loaded:', data.metadata.title);
    } catch (e) {
      console.error('[Cloud Cost Optimization] Invalid JSON:', e.message);
    }
  })();
  </script>
</svg>
