  <text x="52" y="1048" class="label-secondary" font-size="10">Page 1 of 1 · CONFIDENTIAL — Internal Use Only</text>
  <text x="1868" y="1048" text-anchor="end" class="label-secondary" font-size="10">&lt;Project Name&gt; · Version 1.0 · Problem Tree Diagram</text>
  <script type="text/javascript">
  (function() {
    const dataElement = document.currentScript.closest('svg').querySelector('#problem-tree-data');
    if (!dataElement) return;
    try {
      const data = JSON.parse(dataElement.textContent);
      console.log('[Problem Tree Data] Loaded:', data.metadata.title);
    } catch (e) {
      console.error('[Problem Tree] Invalid JSON:', e.message);
    }
  })();
  </script>
