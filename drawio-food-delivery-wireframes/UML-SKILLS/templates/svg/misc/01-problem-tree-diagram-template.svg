  <defs>
    <style>
      :root { --fill-light: #FFFFFF; --stroke-light: #334155; --text-light: #334155; --muted-light: #64748b; --effect-bg: #FEE2E2; --effect-stroke: #FCA5A5; --cause-bg: #DBEAFE; --cause-stroke: #93C5FD; --problem-bg: #FEF3C7; --problem-stroke: #FCD34D; }
      text { font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif; }
      .problem-box { fill: var(--problem-bg); stroke: var(--problem-stroke); stroke-width: 2; }
      .effect-box { fill: var(--effect-bg); stroke: var(--effect-stroke); stroke-width: 1.5; }
      .cause-box { fill: var(--cause-bg); stroke: var(--cause-stroke); stroke-width: 1.5; }
      .label-primary { fill: var(--text-light); font-size: 12px; font-weight: 600; }
      .label-secondary { fill: var(--muted-light); font-size: 10px; }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#FFFFFF"/>
