<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <!-- DATA BLOCK: Single Source of Truth for CI/CD Pipeline -->
  <script type="application/json" id="cicd-pipeline-data">
  {
    "metadata": {
      "title": "CI/CD Pipeline",
      "projectName": "Food Delivery System",
      "description": "Continuous Integration and Continuous Deployment pipeline",
      "version": "1.0",
      "created": "2024-01-01T00:00:00Z",
      "mode": "light"
    },
    "config": {
      "layout": {"canvasWidth": 1920, "canvasHeight": 1080},
      "styling": {"mode": "light", "canvasColor": "#FFFFFF", "fillColor": "#E5E5E5", "strokeColor": "#1A1A1A", "cornerRadius": 8, "strokeWidth": 1.5}
    },
    "data": {
      "stages": [
        {"id": "source", "name": "Source", "description": "Version Control", "x": 180, "y": 380, "width": 340, "height": 120},
        {"id": "build", "name": "Build", "description": "Compile & Package", "x": 600, "y": 380, "width": 340, "height": 120},
        {"id": "test", "name": "Test", "description": "Automated Testing", "x": 1020, "y": 380, "width": 340, "height": 120},
        {"id": "deploy", "name": "Deploy", "description": "Release to Production", "x": 1440, "y": 380, "width": 340, "height": 120}
      ],
      "flow": [
        {"from": "source", "to": "build", "type": "pipeline"},
        {"from": "build", "to": "test", "type": "pipeline"},
        {"from": "test", "to": "deploy", "type": "pipeline"}
      ]
    }
  }
  </script>

  <defs>
    <style>
      :root {
        --canvas-light: #FFFFFF;
        --fill-light: #E5E5E5;
        --stroke-light: #1A1A1A;
        --text-light: #1A1A1A;
        --muted-light: #8A8A85;
      }
      text { font-family: Helvetica, Arial, sans-serif; }
      .stage-box { fill: var(--fill-light); stroke: var(--stroke-light); stroke-width: 1.5; }
      .container-box { fill: none; stroke: var(--stroke-light); stroke-width: 1.5; }
      .label-primary { fill: var(--text-light); font-size: 12px; font-weight: 500; }
      .label-secondary { fill: var(--muted-light); font-size: 9px; font-weight: 400; }
    </style>
    <marker id="arrow-cicd" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1A1A1A"/>
    </marker>
    <pattern id="grid-cicd" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1A1A1A" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect x="40" y="40" width="1840" height="1000" rx="8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  
  <rect x="580" y="52" width="760" height="56" rx="8" class="stage-box"/>
  <text x="960" y="88" text-anchor="middle" class="label-primary" font-size="22">CI/CD Pipeline</text>
  <text x="960" y="108" text-anchor="middle" class="label-secondary">&lt;Project Name&gt; · Template</text>

  <rect x="40" y="118" width="1840" height="882" fill="url(#grid-cicd)"/>
  <rect x="40" y="118" width="1840" height="882" fill="#FFFFFF" fill-opacity="1"/>

  <rect x="180" y="380" width="340" height="120" rx="8" class="stage-box"/>
  <text x="350" y="435" text-anchor="middle" class="label-primary">Source</text>
  <text x="350" y="450" text-anchor="middle" class="label-secondary">Version Control</text>

  <line x1="520" y1="440" x2="600" y2="440" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow-cicd)"/>

  <rect x="600" y="380" width="340" height="120" rx="8" class="stage-box"/>
  <text x="770" y="435" text-anchor="middle" class="label-primary">Build</text>
  <text x="770" y="450" text-anchor="middle" class="label-secondary">Compile & Package</text>

  <line x1="940" y1="440" x2="1020" y2="440" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow-cicd)"/>

  <rect x="1020" y="380" width="340" height="120" rx="8" class="stage-box"/>
  <text x="1190" y="435" text-anchor="middle" class="label-primary">Test</text>
  <text x="1190" y="450" text-anchor="middle" class="label-secondary">Automated Testing</text>

  <line x1="1360" y1="440" x2="1440" y2="440" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow-cicd)"/>

  <rect x="1440" y="380" width="340" height="120" rx="8" class="stage-box"/>
  <text x="1610" y="435" text-anchor="middle" class="label-primary">Deploy</text>
  <text x="1610" y="450" text-anchor="middle" class="label-secondary">Release to Prod</text>

  <rect x="1580" y="850" width="280" height="130" rx="8" class="stage-box"/>
  <text x="1720" y="875" text-anchor="middle" class="label-primary">Legend</text>
  <rect x="1600" y="890" width="20" height="20" rx="4" class="stage-box"/>
  <text x="1630" y="905" class="label-secondary">Stage</text>
  <line x1="1600" y1="930" x2="1620" y2="930" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow-cicd)"/>
  <text x="1630" y="935" class="label-secondary">Pipeline Flow</text>

  <text x="52" y="1048" class="label-secondary">Page 1 of 1 · CONFIDENTIAL — Internal Use Only</text>
  <text x="1868" y="1048" text-anchor="end" class="label-secondary">&lt;Project Name&gt; · Version 1.0 · CI/CD Pipeline</text>

  <script type="text/javascript">
  (function() {
    const dataElement = document.currentScript.closest('svg').querySelector('#cicd-pipeline-data');
    if (!dataElement) return;
    try {
      const data = JSON.parse(dataElement.textContent);
      console.log('[CI/CD Pipeline Data] Loaded:', data.metadata.title);
    } catch (e) {
      console.error('[CI/CD Pipeline] Invalid JSON:', e.message);
    }
  })();
  </script>
</svg>
