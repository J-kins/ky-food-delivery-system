<?XML version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <script type="application/json" id="gitops-data">
  {
    "metadata": {"title": "GitOps Architecture", "projectName": "Food Delivery System", "description": "Git-driven declarative infrastructure and application deployment", "version": "1.0", "mode": "light"},
    "config": {"layout": {"canvasWidth": 1920, "canvasHeight": 1080}, "styling": {"mode": "light", "canvasColor": "#FFFFFF", "fillColor": "#E5E5E5", "strokeColor": "#1A1A1A"}},
    "data": {
      "components": [
        {"id": "git-repo", "name": "Git Repository", "x": 100, "y": 220, "width": 500, "height": 200},
        {"id": "controller", "name": "GitOps Controller", "x": 700, "y": 380, "width": 450, "height": 300},
        {"id": "cluster", "name": "Kubernetes Cluster", "x": 1300, "y": 220, "width": 500, "height": 700}
      ]
    }
  }
  </script>

  <defs>
    <style>
      :root { --canvas-light: #FFFFFF; --fill-light: #E5E5E5; --stroke-light: #1A1A1A; --text-light: #1A1A1A; --muted-light: #8A8A85; }
      text { font-family: Helvetica, Arial, sans-serif; }
      .stage-box { fill: var(--fill-light); stroke: var(--stroke-light); stroke-width: 1.5; }
      .container-box { fill: none; stroke: var(--stroke-light); stroke-width: 1.5; }
      .label-primary { fill: var(--text-light); font-size: 12px; font-weight: 500; }
      .label-secondary { fill: var(--muted-light); font-size: 9px; font-weight: 400; }
    </style>
    <pattern id="grid-gitops" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1A1A1A" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect x="40" y="40" width="1840" height="1000" rx="8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  
  <rect x="520" y="52" width="880" height="56" rx="8" class="stage-box"/>
  <text x="960" y="88" text-anchor="middle" class="label-primary" font-size="22">GitOps Architecture</text>
  <text x="960" y="108" text-anchor="middle" class="label-secondary">&lt;Project Name&gt; · Template</text>

  <rect x="40" y="118" width="1840" height="882" fill="url(#grid-gitops)"/>
  <rect x="40" y="118" width="1840" height="882" fill="#FFFFFF" fill-opacity="1"/>

  <rect x="100" y="220" width="500" height="200" rx="8" class="stage-box"/>
  <text x="350" y="325" text-anchor="middle" class="label-primary">Git Repository</text>

  <rect x="700" y="380" width="450" height="300" rx="8" class="stage-box"/>
  <text x="925" y="535" text-anchor="middle" class="label-primary">GitOps Controller</text>

  <rect x="1300" y="220" width="500" height="700" rx="8" class="container-box"/>
  <text x="1310" y="240" class="label-primary">Kubernetes Cluster</text>

  <text x="52" y="1048" class="label-secondary">Page 1 of 1 · CONFIDENTIAL — Internal Use Only</text>
  <text x="1868" y="1048" text-anchor="end" class="label-secondary">&lt;Project Name&gt; · Version 1.0 · GitOps Architecture</text>

  <script type="text/javascript">
  (function() {
    const dataElement = document.currentScript.closest('svg').querySelector('#gitops-data');
    if (!dataElement) return;
    try {
      const data = JSON.parse(dataElement.textContent);
      console.log('[GitOps Architecture Data] Loaded:', data.metadata.title);
    } catch (e) {
      console.error('[GitOps Architecture] Invalid JSON:', e.message);
    }
  })();
  </script>
</svg>
