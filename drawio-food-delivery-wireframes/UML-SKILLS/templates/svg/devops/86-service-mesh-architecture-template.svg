<?XML version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <script type="application/json" id="service-mesh-data">
  {
    "metadata": {"title": "Service Mesh Architecture", "projectName": "Food Delivery System", "description": "Distributed microservices communication and management", "version": "1.0", "mode": "light"},
    "config": {"layout": {"canvasWidth": 1920, "canvasHeight": 1080}, "styling": {"mode": "light", "canvasColor": "#FFFFFF", "fillColor": "#E5E5E5", "strokeColor": "#1A1A1A"}},
    "data": {
      "components": [
        {"id": "control-plane", "name": "Control Plane", "x": 100, "y": 220, "width": 500, "height": 200},
        {"id": "data-plane", "name": "Data Plane", "x": 700, "y": 300, "width": 1100, "height": 550},
        {"id": "sidecars", "name": "Service Proxies", "description": "Envoy Sidecars", "x": 720, "y": 350, "width": 250, "height": 150}
      ]
    }
  }
  </script>

  <defs>
    <style>
      :root { --canvas-light: #FFFFFF; --fill-light: #E5E5E5; --stroke-light: #1A1A1A; --text-light: #1A1A1A; --muted-light: #8A8A85; }
      text { font-family: Helvetica, Arial, sans-serif; }
      .stage-box { fill: var(--fill-light); stroke: var(--stroke-light); stroke-width: 1.5; }
      .container-box { fill: none; stroke: var(--stroke-light); stroke-width: 1.5; }
      .label-primary { fill: var(--text-light); font-size: 12px; font-weight: 500; }
      .label-secondary { fill: var(--muted-light); font-size: 9px; font-weight: 400; }
    </style>
    <pattern id="grid-mesh" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1A1A1A" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect x="40" y="40" width="1840" height="1000" rx="8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  
  <rect x="440" y="52" width="1040" height="56" rx="8" class="stage-box"/>
  <text x="960" y="88" text-anchor="middle" class="label-primary" font-size="22">Service Mesh Architecture</text>
  <text x="960" y="108" text-anchor="middle" class="label-secondary">&lt;Project Name&gt; · Template</text>

  <rect x="40" y="118" width="1840" height="882" fill="url(#grid-mesh)"/>
  <rect x="40" y="118" width="1840" height="882" fill="#FFFFFF" fill-opacity="1"/>

  <rect x="100" y="220" width="500" height="200" rx="8" class="stage-box"/>
  <text x="350" y="325" text-anchor="middle" class="label-primary">Control Plane</text>

  <rect x="700" y="300" width="1100" height="550" rx="8" class="container-box"/>
  <text x="710" y="320" class="label-primary">Data Plane</text>

  <rect x="720" y="350" width="250" height="150" rx="8" class="stage-box"/>
  <text x="845" y="425" text-anchor="middle" class="label-primary">Service Proxy</text>
  <text x="845" y="440" text-anchor="middle" class="label-secondary">Envoy Sidecar</text>

  <rect x="1050" y="350" width="250" height="150" rx="8" class="stage-box"/>
  <text x="1175" y="425" text-anchor="middle" class="label-primary">Service Proxy</text>
  <text x="1175" y="440" text-anchor="middle" class="label-secondary">Envoy Sidecar</text>

  <rect x="1380" y="350" width="250" height="150" rx="8" class="stage-box"/>
  <text x="1505" y="425" text-anchor="middle" class="label-primary">Service Proxy</text>
  <text x="1505" y="440" text-anchor="middle" class="label-secondary">Envoy Sidecar</text>

  <text x="52" y="1048" class="label-secondary">Page 1 of 1 · CONFIDENTIAL — Internal Use Only</text>
  <text x="1868" y="1048" text-anchor="end" class="label-secondary">&lt;Project Name&gt; · Version 1.0 · Service Mesh Architecture</text>

  <script type="text/javascript">
  (function() {
    const dataElement = document.currentScript.closest('svg').querySelector('#service-mesh-data');
    if (!dataElement) return;
    try {
      const data = JSON.parse(dataElement.textContent);
      console.log('[Service Mesh Architecture Data] Loaded:', data.metadata.title);
    } catch (e) {
      console.error('[Service Mesh Architecture] Invalid JSON:', e.message);
    }
  })();
  </script>
</svg>
