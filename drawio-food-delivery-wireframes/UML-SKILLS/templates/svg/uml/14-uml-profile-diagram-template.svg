  <text x="52" y="1048" class="label-primary" font-size="10">Page 1 of 1 · CONFIDENTIAL — Internal Use Only</text>
  <text x="1868" y="1048" text-anchor="end" class="label-primary" font-size="10">&lt;Project Name&gt; · Version 1.0 · UML Profile Diagram</text>
  <script type="text/javascript">
  (function() {
    const dataElement = document.currentScript.closest('svg').querySelector('#uml-profile-diagram-data');
    if (!dataElement) return;
    try {
      const data = JSON.parse(dataElement.textContent);
      console.log('[UML Profile Diagram Data] Loaded:', data.metadata.title);
    } catch (e) {
      console.error('[UML Profile Diagram] Invalid JSON:', e.message);
    }
  })();
  </script>
</svg>
