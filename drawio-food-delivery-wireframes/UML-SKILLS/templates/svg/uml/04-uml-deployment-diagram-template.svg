  <line x1="330" y1="370" x2="650" y2="370" stroke="#334155" stroke-width="1.5"/>
  <line x1="830" y1="370" x2="1150" y2="370" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="1048" class="label-primary" font-size="10">Page 1 of 1 · CONFIDENTIAL — Internal Use Only</text>
  <text x="1868" y="1048" text-anchor="end" class="label-primary" font-size="10">&lt;Project Name&gt; · Version 1.0 · UML Deployment Diagram</text>
  <script type="text/javascript">
  (function() {
    const dataElement = document.currentScript.closest('svg').querySelector('#uml-deployment-diagram-data');
    if (!dataElement) return;
    try {
      const data = JSON.parse(dataElement.textContent);
      console.log('[UML Deployment Diagram Data] Loaded:', data.metadata.title);
    } catch (e) {
      console.error('[UML Deployment Diagram] Invalid JSON:', e.message);
    }
  })();
  </script>
