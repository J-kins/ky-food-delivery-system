<?XML version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <script type="application/json" id="uml-deployment-diagram-data">
  {
    "metadata": {"title": "UML Deployment Diagram", "projectName": "Food Delivery System", "description": "Hardware architecture and software deployment topology", "version": "1.0", "mode": "light"},
    "config": {"layout": {"canvasWidth": 1920, "canvasHeight": 1080}, "styling": {"mode": "light", "canvasColor": "#FFFFFF", "fillColor": "#FFFFFF", "strokeColor": "#334155"}},
    "data": {
      "nodes": [
        {"id": "node1", "name": "Client Node", "x": 150, "y": 300, "width": 180, "height": 140},
        {"id": "node2", "name": "Server Node", "x": 650, "y": 300, "width": 180, "height": 140},
        {"id": "node3", "name": "Database Node", "x": 1150, "y": 300, "width": 180, "height": 140}
      ],
      "connections": [
        {"from": "node1", "to": "node2"},
        {"from": "node2", "to": "node3"}
      ]
    }
  }
  </script>
  <defs>
    <style>
      :root { --fill-light: #FFFFFF; --stroke-light: #334155; --text-light: #334155; }
      text { font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif; }
      .device-box { fill: var(--fill-light); stroke: var(--stroke-light); stroke-width: 1.5; }
      .label-primary { fill: var(--text-light); font-size: 12px; font-weight: 600; }
    </style>
    <pattern id="grid-deployment" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect x="40" y="40" width="1840" height="1000" rx="8" fill="#FFFFFF" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="520" y="52" width="880" height="56" rx="6" fill="#3B82F6"/>
  <text x="960" y="88" text-anchor="middle" fill="#FFFFFF" class="label-primary" font-size="22">UML Deployment Diagram</text>
  <text x="960" y="108" text-anchor="middle" fill="#EFF6FF" class="label-primary" font-size="12">&lt;Project Name&gt; · Template</text>
  <rect x="40" y="118" width="1840" height="882" fill="url(#grid-deployment)"/>
  <rect x="40" y="118" width="1840" height="882" fill="#f8fafc" fill-opacity="0.35"/>
  <rect x="150" y="300" width="180" height="140" class="device-box"/>
  <text x="240" y="375" text-anchor="middle" class="label-primary">Client Node</text>
  <rect x="650" y="300" width="180" height="140" class="device-box"/>
  <text x="740" y="375" text-anchor="middle" class="label-primary">Server Node</text>
  <rect x="1150" y="300" width="180" height="140" class="device-box"/>
