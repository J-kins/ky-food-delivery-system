  <script type="text/javascript">
  (function() {
    const dataElement = document.currentScript.closest('svg').querySelector('#uml-communication-diagram-data');
    if (!dataElement) return;
    try {
      const data = JSON.parse(dataElement.textContent);
      console.log('[UML Communication Diagram Data] Loaded:', data.metadata.title);
    } catch (e) {
      console.error('[UML Communication Diagram] Invalid JSON:', e.message);
    }
  })();
