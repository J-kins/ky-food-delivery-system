<?XML version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <script type="application/json" id="uml-sequence-diagram-data">
  {
    "metadata": {"title": "UML Sequence Diagram", "projectName": "Food Delivery System", "description": "Temporal message passing and interaction sequence", "version": "1.0", "mode": "light"},
    "config": {"layout": {"canvasWidth": 1920, "canvasHeight": 1080}, "styling": {"mode": "light", "canvasColor": "#FFFFFF", "fillColor": "#FFFFFF", "strokeColor": "#334155"}},
    "data": {
      "participants": [
        {"id": "actor", "name": "Actor", "x": 150, "y": 150, "width": 100, "height": 60},
        {"id": "obj1", "name": "Object1", "x": 550, "y": 150, "width": 100, "height": 60},
        {"id": "obj2", "name": "Object2", "x": 950, "y": 150, "width": 100, "height": 60}
      ],
      "messages": [
        {"from": "actor", "to": "obj1", "label": "message1", "y": 300},
        {"from": "obj1", "to": "obj2", "label": "message2", "y": 400},
        {"from": "obj2", "to": "obj1", "label": "return", "y": 500}
      ]
    }
  }
  </script>
  <defs>
    <style>
      :root { --fill-light: #FFFFFF; --stroke-light: #334155; --text-light: #334155; --muted-light: #64748b; }
      text { font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif; }
      .participant-box { fill: var(--fill-light); stroke: var(--stroke-light); stroke-width: 1.5; }
      .label-primary { fill: var(--text-light); font-size: 11px; font-weight: 600; }
      .label-secondary { fill: var(--muted-light); font-size: 9px; }
    </style>
    <marker id="arrow-seq" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
    <pattern id="grid-sequence" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect x="40" y="40" width="1840" height="1000" rx="8" fill="#FFFFFF" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="520" y="52" width="880" height="56" rx="6" fill="#3B82F6"/>
  <text x="960" y="88" text-anchor="middle" fill="#FFFFFF" class="label-primary" font-size="22">UML Sequence Diagram</text>
  <text x="960" y="108" text-anchor="middle" fill="#EFF6FF" class="label-primary" font-size="12">&lt;Project Name&gt; · Template</text>
  <rect x="40" y="118" width="1840" height="882" fill="url(#grid-sequence)"/>
  <rect x="40" y="118" width="1840" height="882" fill="#f8fafc" fill-opacity="0.35"/>
  <rect x="100" y="150" width="100" height="60" class="participant-box"/>
  <text x="150" y="185" text-anchor="middle" class="label-primary">Actor</text>
  <line x1="150" y1="210" x2="150" y2="750" stroke="#334155" stroke-width="1" stroke-dasharray="5,5"/>
  <rect x="500" y="150" width="100" height="60" class="participant-box"/>
  <text x="550" y="185" text-anchor="middle" class="label-primary">Object1</text>
  <line x1="550" y1="210" x2="550" y2="750" stroke="#334155" stroke-width="1" stroke-dasharray="5,5"/>
  <rect x="900" y="150" width="100" height="60" class="participant-box"/>
  <text x="950" y="185" text-anchor="middle" class="label-primary">Object2</text>
  <line x1="950" y1="210" x2="950" y2="750" stroke="#334155" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="150" y1="300" x2="550" y2="300" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow-seq)"/>
  <text x="350" y="290" text-anchor="middle" class="label-secondary">message1</text>
  <line x1="550" y1="400" x2="950" y2="400" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow-seq)"/>
  <text x="750" y="390" text-anchor="middle" class="label-secondary">message2</text>
  <line x1="950" y1="500" x2="550" y2="500" stroke="#334155" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrow-seq)"/>
  <text x="750" y="490" text-anchor="middle" class="label-secondary">return</text>
  <text x="52" y="1048" class="label-primary" font-size="10">Page 1 of 1 · CONFIDENTIAL — Internal Use Only</text>
  <text x="1868" y="1048" text-anchor="end" class="label-primary" font-size="10">&lt;Project Name&gt; · Version 1.0 · UML Sequence Diagram</text>
  <script type="text/javascript">
  (function() {
    const dataElement = document.currentScript.closest('svg').querySelector('#uml-sequence-diagram-data');
    if (!dataElement) return;
    try {
      const data = JSON.parse(dataElement.textContent);
      console.log('[UML Sequence Diagram Data] Loaded:', data.metadata.title);
    } catch (e) {
      console.error('[UML Sequence Diagram] Invalid JSON:', e.message);
    }
  })();
  </script>
