  <script type="text/javascript">
  (function() {
    const dataElement = document.currentScript.closest('svg').querySelector('#uml-interaction-overview-data');
    if (!dataElement) return;
    try {
      const data = JSON.parse(dataElement.textContent);
      console.log('[UML Interaction Overview Data] Loaded:', data.metadata.title);
    } catch (e) {
      console.error('[UML Interaction Overview] Invalid JSON:', e.message);
    }
  })();
