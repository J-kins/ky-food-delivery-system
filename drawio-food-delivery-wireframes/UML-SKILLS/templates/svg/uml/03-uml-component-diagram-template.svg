  <script type="text/javascript">
  (function() {
    const dataElement = document.currentScript.closest('svg').querySelector('#uml-component-diagram-data');
    if (!dataElement) return;
    try {
      const data = JSON.parse(dataElement.textContent);
      console.log('[UML Component Diagram Data] Loaded:', data.metadata.title);
    } catch (e) {
      console.error('[UML Component Diagram] Invalid JSON:', e.message);
    }
  })();
