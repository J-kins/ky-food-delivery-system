<?XML version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <script type="application/json" id="geoprocessing-workflow-data">
  {
    "metadata": {"title": "Geoprocessing Workflow", "projectName": "Food Delivery System", "description": "Spatial analysis and processing operations", "version": "1.0", "mode": "light"},
    "config": {"layout": {"canvasWidth": 1920, "canvasHeight": 1080}, "styling": {"mode": "light", "canvasColor": "#FFFFFF", "fillColor": "#E5E5E5", "strokeColor": "#1A1A1A"}},
    "data": {
      "stages": [
        {"id": "input", "name": "Input Data", "x": 150, "y": 380, "width": 300, "height": 120},
        {"id": "processing", "name": "Processing", "x": 650, "y": 300, "width": 300, "height": 280},
        {"id": "analysis", "name": "Analysis", "x": 1150, "y": 380, "width": 300, "height": 120},
        {"id": "output", "name": "Output", "x": 1650, "y": 380, "width": 200, "height": 120}
      ]
    }
  }
  </script>

  <defs>
    <style>
      :root { --canvas-light: #FFFFFF; --fill-light: #E5E5E5; --stroke-light: #1A1A1A; --text-light: #1A1A1A; --muted-light: #8A8A85; }
      text { font-family: Helvetica, Arial, sans-serif; }
      .component-box { fill: var(--fill-light); stroke: var(--stroke-light); stroke-width: 1.5; }
      .label-primary { fill: var(--text-light); font-size: 12px; font-weight: 500; }
      .label-secondary { fill: var(--muted-light); font-size: 9px; font-weight: 400; }
    </style>
    <marker id="arrow-geoprocessing" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1A1A1A"/>
    </marker>
    <pattern id="grid-geoprocessing" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1A1A1A" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect x="40" y="40" width="1840" height="1000" rx="8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  
  <rect x="440" y="52" width="1040" height="56" rx="8" class="component-box"/>
  <text x="960" y="88" text-anchor="middle" class="label-primary" font-size="22">Geoprocessing Workflow</text>
  <text x="960" y="108" text-anchor="middle" class="label-secondary">&lt;Project Name&gt; · Template</text>

  <rect x="40" y="118" width="1840" height="882" fill="url(#grid-geoprocessing)"/>
  <rect x="40" y="118" width="1840" height="882" fill="#FFFFFF" fill-opacity="1"/>

  <rect x="150" y="380" width="300" height="120" rx="8" class="component-box"/>
  <text x="300" y="435" text-anchor="middle" class="label-primary">Input Data</text>

  <line x1="450" y1="440" x2="650" y2="440" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow-geoprocessing)"/>

  <rect x="650" y="300" width="300" height="280" rx="8" class="component-box"/>
  <text x="800" y="440" text-anchor="middle" class="label-primary">Processing</text>

  <line x1="950" y1="440" x2="1150" y2="440" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow-geoprocessing)"/>

  <rect x="1150" y="380" width="300" height="120" rx="8" class="component-box"/>
  <text x="1300" y="435" text-anchor="middle" class="label-primary">Analysis</text>

  <line x1="1450" y1="440" x2="1650" y2="440" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow-geoprocessing)"/>

  <rect x="1650" y="380" width="200" height="120" rx="8" class="component-box"/>
  <text x="1750" y="435" text-anchor="middle" class="label-primary">Output</text>

  <text x="52" y="1048" class="label-secondary">Page 1 of 1 · CONFIDENTIAL — Internal Use Only</text>
  <text x="1868" y="1048" text-anchor="end" class="label-secondary">&lt;Project Name&gt; · Version 1.0 · Geoprocessing Workflow</text>

  <script type="text/javascript">
  (function() {
    const dataElement = document.currentScript.closest('svg').querySelector('#geoprocessing-workflow-data');
    if (!dataElement) return;
    try {
      const data = JSON.parse(dataElement.textContent);
      console.log('[Geoprocessing Workflow Data] Loaded:', data.metadata.title);
    } catch (e) {
      console.error('[Geoprocessing Workflow] Invalid JSON:', e.message);
    }
  })();
  </script>
</svg>
