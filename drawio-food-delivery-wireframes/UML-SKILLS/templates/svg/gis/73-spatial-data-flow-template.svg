<?XML version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <script type="application/json" id="spatial-data-flow-data">
  {
    "metadata": {"title": "Spatial Data Flow", "projectName": "Food Delivery System", "description": "Data flow for geospatial information processing", "version": "1.0", "mode": "light"},
    "config": {"layout": {"canvasWidth": 1920, "canvasHeight": 1080}, "styling": {"mode": "light", "canvasColor": "#FFFFFF", "fillColor": "#E5E5E5", "strokeColor": "#1A1A1A"}},
    "data": {
      "sources": [
        {"id": "gps", "name": "GPS Sources", "x": 150, "y": 250, "width": 350, "height": 150},
        {"id": "aerial", "name": "Aerial Imagery", "x": 150, "y": 500, "width": 350, "height": 150}
      ],
      "processing": [
        {"id": "collect", "name": "Data Collection", "x": 650, "y": 300, "width": 300, "height": 180},
        {"id": "transform", "name": "Transform", "x": 1100, "y": 300, "width": 300, "height": 180}
      ],
      "output": [
        {"id": "storage", "name": "Spatial Storage", "x": 1550, "y": 380, "width": 300, "height": 120}
      ]
    }
  }
  </script>

  <defs>
    <style>
      :root { --canvas-light: #FFFFFF; --fill-light: #E5E5E5; --stroke-light: #1A1A1A; --text-light: #1A1A1A; --muted-light: #8A8A85; }
      text { font-family: Helvetica, Arial, sans-serif; }
      .component-box { fill: var(--fill-light); stroke: var(--stroke-light); stroke-width: 1.5; }
      .label-primary { fill: var(--text-light); font-size: 12px; font-weight: 500; }
      .label-secondary { fill: var(--muted-light); font-size: 9px; font-weight: 400; }
    </style>
    <marker id="arrow-spatial" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1A1A1A"/>
    </marker>
    <pattern id="grid-spatial" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1A1A1A" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect x="40" y="40" width="1840" height="1000" rx="8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  
  <rect x="520" y="52" width="880" height="56" rx="8" class="component-box"/>
  <text x="960" y="88" text-anchor="middle" class="label-primary" font-size="22">Spatial Data Flow</text>
  <text x="960" y="108" text-anchor="middle" class="label-secondary">&lt;Project Name&gt; · Template</text>

  <rect x="40" y="118" width="1840" height="882" fill="url(#grid-spatial)"/>
  <rect x="40" y="118" width="1840" height="882" fill="#FFFFFF" fill-opacity="1"/>

  <rect x="150" y="250" width="350" height="150" rx="8" class="component-box"/>
  <text x="325" y="320" text-anchor="middle" class="label-primary">GPS Sources</text>

  <rect x="150" y="500" width="350" height="150" rx="8" class="component-box"/>
  <text x="325" y="570" text-anchor="middle" class="label-primary">Aerial Imagery</text>

  <line x1="500" y1="325" x2="650" y2="325" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow-spatial)"/>
  <line x1="500" y1="575" x2="650" y2="425" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow-spatial)"/>

  <rect x="650" y="300" width="300" height="180" rx="8" class="component-box"/>
  <text x="800" y="380" text-anchor="middle" class="label-primary">Data Collection</text>

  <line x1="950" y1="390" x2="1100" y2="390" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow-spatial)"/>

  <rect x="1100" y="300" width="300" height="180" rx="8" class="component-box"/>
  <text x="1250" y="380" text-anchor="middle" class="label-primary">Transform</text>

  <line x1="1400" y1="390" x2="1550" y2="440" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow-spatial)"/>

  <rect x="1550" y="380" width="300" height="120" rx="8" class="component-box"/>
  <text x="1700" y="435" text-anchor="middle" class="label-primary">Spatial Storage</text>

  <text x="52" y="1048" class="label-secondary">Page 1 of 1 · CONFIDENTIAL — Internal Use Only</text>
  <text x="1868" y="1048" text-anchor="end" class="label-secondary">&lt;Project Name&gt; · Version 1.0 · Spatial Data Flow</text>

  <script type="text/javascript">
  (function() {
    const dataElement = document.currentScript.closest('svg').querySelector('#spatial-data-flow-data');
    if (!dataElement) return;
    try {
      const data = JSON.parse(dataElement.textContent);
      console.log('[Spatial Data Flow Data] Loaded:', data.metadata.title);
    } catch (e) {
      console.error('[Spatial Data Flow] Invalid JSON:', e.message);
    }
  })();
  </script>
</svg>
