<?XML version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <script type="application/json" id="geospatial-data-model">
  {
    "metadata": {"title": "Geospatial Data Model", "projectName": "Food Delivery System", "description": "Geographic data representation and relationships", "version": "1.0", "mode": "light"},
    "config": {"layout": {"canvasWidth": 1920, "canvasHeight": 1080}, "styling": {"mode": "light", "canvasColor": "#FFFFFF", "fillColor": "#E5E5E5", "strokeColor": "#1A1A1A"}},
    "data": {
      "entities": [
        {"id": "points", "name": "Points", "description": "Delivery Locations", "x": 200, "y": 250, "width": 350, "height": 200},
        {"id": "lines", "name": "Lines", "description": "Route Networks", "x": 750, "y": 250, "width": 350, "height": 200},
        {"id": "polygons", "name": "Polygons", "description": "Service Areas", "x": 1300, "y": 250, "width": 350, "height": 200}
      ]
    }
  }
  </script>

  <defs>
    <style>
      :root { --canvas-light: #FFFFFF; --fill-light: #E5E5E5; --stroke-light: #1A1A1A; --text-light: #1A1A1A; --muted-light: #8A8A85; }
      text { font-family: Helvetica, Arial, sans-serif; }
      .component-box { fill: var(--fill-light); stroke: var(--stroke-light); stroke-width: 1.5; }
      .label-primary { fill: var(--text-light); font-size: 12px; font-weight: 500; }
      .label-secondary { fill: var(--muted-light); font-size: 9px; font-weight: 400; }
    </style>
    <pattern id="grid-geospatial" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1A1A1A" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect x="40" y="40" width="1840" height="1000" rx="8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  
  <rect x="440" y="52" width="1040" height="56" rx="8" class="component-box"/>
  <text x="960" y="88" text-anchor="middle" class="label-primary" font-size="22">Geospatial Data Model</text>
  <text x="960" y="108" text-anchor="middle" class="label-secondary">&lt;Project Name&gt; · Template</text>

  <rect x="40" y="118" width="1840" height="882" fill="url(#grid-geospatial)"/>
  <rect x="40" y="118" width="1840" height="882" fill="#FFFFFF" fill-opacity="1"/>

  <rect x="200" y="250" width="350" height="200" rx="8" class="component-box"/>
  <text x="375" y="330" text-anchor="middle" class="label-primary">Points</text>
  <text x="375" y="350" text-anchor="middle" class="label-secondary">Delivery Locations</text>

  <rect x="750" y="250" width="350" height="200" rx="8" class="component-box"/>
  <text x="925" y="330" text-anchor="middle" class="label-primary">Lines</text>
  <text x="925" y="350" text-anchor="middle" class="label-secondary">Route Networks</text>

  <rect x="1300" y="250" width="350" height="200" rx="8" class="component-box"/>
  <text x="1475" y="330" text-anchor="middle" class="label-primary">Polygons</text>
  <text x="1475" y="350" text-anchor="middle" class="label-secondary">Service Areas</text>

  <rect x="300" y="550" width="1320" height="280" rx="8" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="310" y="570" class="label-primary">Spatial Relationships</text>

  <text x="52" y="1048" class="label-secondary">Page 1 of 1 · CONFIDENTIAL — Internal Use Only</text>
  <text x="1868" y="1048" text-anchor="end" class="label-secondary">&lt;Project Name&gt; · Version 1.0 · Geospatial Data Model</text>

  <script type="text/javascript">
  (function() {
    const dataElement = document.currentScript.closest('svg').querySelector('#geospatial-data-model');
    if (!dataElement) return;
    try {
      const data = JSON.parse(dataElement.textContent);
      console.log('[Geospatial Data Model] Loaded:', data.metadata.title);
    } catch (e) {
      console.error('[Geospatial Data Model] Invalid JSON:', e.message);
    }
  })();
  </script>
</svg>
