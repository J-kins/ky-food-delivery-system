<?XML version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <script type="application/json" id="map-design-data">
  {
    "metadata": {"title": "Map Design", "projectName": "Food Delivery System", "description": "Map composition and visualization design", "version": "1.0", "mode": "light"},
    "config": {"layout": {"canvasWidth": 1920, "canvasHeight": 1080}, "styling": {"mode": "light", "canvasColor": "#FFFFFF", "fillColor": "#E5E5E5", "strokeColor": "#1A1A1A"}},
    "data": {
      "layers": [
        {"id": "base-map", "name": "Base Map", "x": 150, "y": 250, "width": 380, "height": 600},
        {"id": "thematic", "name": "Thematic Layers", "x": 640, "y": 250, "width": 380, "height": 600},
        {"id": "annotations", "name": "Annotations", "x": 1130, "y": 250, "width": 380, "height": 600}
      ]
    }
  }
  </script>

  <defs>
    <style>
      :root { --canvas-light: #FFFFFF; --fill-light: #E5E5E5; --stroke-light: #1A1A1A; --text-light: #1A1A1A; --muted-light: #8A8A85; }
      text { font-family: Helvetica, Arial, sans-serif; }
      .component-box { fill: var(--fill-light); stroke: var(--stroke-light); stroke-width: 1.5; }
      .container-box { fill: none; stroke: var(--stroke-light); stroke-width: 1.5; }
      .label-primary { fill: var(--text-light); font-size: 12px; font-weight: 500; }
      .label-secondary { fill: var(--muted-light); font-size: 9px; font-weight: 400; }
    </style>
    <pattern id="grid-map-design" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1A1A1A" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect x="40" y="40" width="1840" height="1000" rx="8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  
  <rect x="580" y="52" width="760" height="56" rx="8" class="component-box"/>
  <text x="960" y="88" text-anchor="middle" class="label-primary" font-size="22">Map Design</text>
  <text x="960" y="108" text-anchor="middle" class="label-secondary">&lt;Project Name&gt; · Template</text>

  <rect x="40" y="118" width="1840" height="882" fill="url(#grid-map-design)"/>
  <rect x="40" y="118" width="1840" height="882" fill="#FFFFFF" fill-opacity="1"/>

  <rect x="150" y="250" width="380" height="600" rx="8" class="container-box"/>
  <text x="160" y="270" class="label-primary">Base Map</text>

  <rect x="640" y="250" width="380" height="600" rx="8" class="container-box"/>
  <text x="650" y="270" class="label-primary">Thematic Layers</text>

  <rect x="1130" y="250" width="380" height="600" rx="8" class="container-box"/>
  <text x="1140" y="270" class="label-primary">Annotations</text>

  <text x="52" y="1048" class="label-secondary">Page 1 of 1 · CONFIDENTIAL — Internal Use Only</text>
  <text x="1868" y="1048" text-anchor="end" class="label-secondary">&lt;Project Name&gt; · Version 1.0 · Map Design</text>

  <script type="text/javascript">
  (function() {
    const dataElement = document.currentScript.closest('svg').querySelector('#map-design-data');
    if (!dataElement) return;
    try {
      const data = JSON.parse(dataElement.textContent);
      console.log('[Map Design Data] Loaded:', data.metadata.title);
    } catch (e) {
      console.error('[Map Design] Invalid JSON:', e.message);
    }
  })();
  </script>
</svg>
