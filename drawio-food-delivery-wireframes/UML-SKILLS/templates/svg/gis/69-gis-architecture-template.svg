<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <!-- DATA BLOCK: Single Source of Truth for GIS Architecture -->
  <script type="application/json" id="gis-architecture-data">
  {
    "metadata": {
      "title": "GIS Architecture",
      "projectName": "Food Delivery System",
      "description": "Geographic Information System architecture for location services",
      "version": "1.0",
      "created": "2024-01-01T00:00:00Z",
      "mode": "light"
    },
    "config": {
      "layout": {"canvasWidth": 1920, "canvasHeight": 1080},
      "styling": {"mode": "light", "canvasColor": "#FFFFFF", "fillColor": "#E5E5E5", "strokeColor": "#1A1A1A", "cornerRadius": 8, "strokeWidth": 1.5}
    },
    "data": {
      "layers": [
        {"id": "client", "name": "Client Application", "x": 1240, "y": 360, "width": 200, "height": 120},
        {"id": "server", "name": "GIS Server", "x": 280, "y": 360, "width": 200, "height": 120},
        {"id": "database", "name": "Spatial Database", "x": 760, "y": 360, "width": 200, "height": 120}
      ],
      "connections": [
        {"from": "client", "to": "server", "type": "HTTP/REST"},
        {"from": "server", "to": "database", "type": "Spatial Queries"}
      ]
    }
  }
  </script>

  <defs>
    <style>
      :root {
        --canvas-light: #FFFFFF;
        --fill-light: #E5E5E5;
        --stroke-light: #1A1A1A;
        --text-light: #1A1A1A;
        --muted-light: #8A8A85;
      }
      text { font-family: Helvetica, Arial, sans-serif; }
      .component-box { fill: var(--fill-light); stroke: var(--stroke-light); stroke-width: 1.5; }
      .container-box { fill: none; stroke: var(--stroke-light); stroke-width: 1.5; }
      .label-primary { fill: var(--text-light); font-size: 12px; font-weight: 500; }
      .label-secondary { fill: var(--muted-light); font-size: 9px; font-weight: 400; }
    </style>
    <marker id="arrow-gis" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1A1A1A"/>
    </marker>
    <pattern id="grid-gis" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1A1A1A" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect x="40" y="40" width="1840" height="1000" rx="8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  
  <rect x="580" y="52" width="760" height="56" rx="8" class="component-box"/>
  <text x="960" y="88" text-anchor="middle" class="label-primary" font-size="22">GIS Architecture</text>
  <text x="960" y="108" text-anchor="middle" class="label-secondary">&lt;Project Name&gt; · Template</text>

  <rect x="40" y="118" width="1840" height="882" fill="url(#grid-gis)"/>
  <rect x="40" y="118" width="1840" height="882" fill="#FFFFFF" fill-opacity="1"/>

  <rect x="280" y="360" width="200" height="120" rx="8" class="component-box"/>
  <text x="380" y="415" text-anchor="middle" class="label-primary">GIS Server</text>
  <text x="380" y="430" text-anchor="middle" class="label-secondary">Map Services</text>

  <line x1="480" y1="420" x2="760" y2="420" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow-gis)"/>

  <rect x="760" y="360" width="200" height="120" rx="8" class="component-box"/>
  <text x="860" y="415" text-anchor="middle" class="label-primary">Spatial DB</text>
  <text x="860" y="430" text-anchor="middle" class="label-secondary">Geographic Data</text>

  <line x1="960" y1="420" x2="1240" y2="420" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow-gis)"/>

  <rect x="1240" y="360" width="200" height="120" rx="8" class="component-box"/>
  <text x="1340" y="415" text-anchor="middle" class="label-primary">Client App</text>
  <text x="1340" y="430" text-anchor="middle" class="label-secondary">Map Interface</text>

  <rect x="1580" y="850" width="280" height="130" rx="8" class="component-box"/>
  <text x="1720" y="875" text-anchor="middle" class="label-primary">Legend</text>
  <rect x="1600" y="890" width="20" height="20" rx="4" class="component-box"/>
  <text x="1630" y="905" class="label-secondary">GIS Component</text>
  <line x1="1600" y1="930" x2="1620" y2="930" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrow-gis)"/>
  <text x="1630" y="935" class="label-secondary">Data Flow</text>

  <text x="52" y="1048" class="label-secondary">Page 1 of 1 · CONFIDENTIAL — Internal Use Only</text>
  <text x="1868" y="1048" text-anchor="end" class="label-secondary">&lt;Project Name&gt; · Version 1.0 · GIS Architecture</text>

  <script type="text/javascript">
  (function() {
    const dataElement = document.currentScript.closest('svg').querySelector('#gis-architecture-data');
    if (!dataElement) return;
    try {
      const data = JSON.parse(dataElement.textContent);
      console.log('[GIS Architecture Data] Loaded:', data.metadata.title);
    } catch (e) {
      console.error('[GIS Architecture] Invalid JSON:', e.message);
    }
  })();
  </script>
</svg>
