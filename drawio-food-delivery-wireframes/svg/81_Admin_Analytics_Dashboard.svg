<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Poppins:wght@400;500;600;700&amp;display=swap');
      
      * { box-sizing: border-box; }
      text { font-family: 'Poppins', sans-serif; fill: #3B2A1A; }
      .heading { font-family: 'Baloo 2', sans-serif; font-weight: 700; fill: #005638; }
      .subheading { font-weight: 600; fill: #3B2A1A; }
      
      .bg { fill: #F7F4EF; }
      .card { fill: #FFFFFF; stroke: #EDE9E3; stroke-width: 1px; rx: 12px; }
      .shadow { filter: drop-shadow(0 4px 12px rgba(59,42,26,0.08)); }
      
      .btn-primary { fill: #005638; rx: 8px; }
      .btn-primary-text { fill: #FFFFFF; font-weight: 600; font-size: 16px; text-anchor: middle; alignment-baseline: middle; }
      
      .btn-secondary { fill: #F0C019; rx: 8px; }
      .btn-secondary-text { fill: #3B2A1A; font-weight: 600; font-size: 16px; text-anchor: middle; alignment-baseline: middle; }
      
      .input-bg { fill: #FFFFFF; stroke: #A89F93; stroke-width: 1.5px; rx: 8px; }
      .input-text { fill: #A89F93; font-size: 14px; alignment-baseline: middle; }
      
      .navbar { fill: #FFFFFF; stroke: #EDE9E3; stroke-width: 1px; }
      .bottom-bar { fill: #FFFFFF; stroke: #EDE9E3; stroke-width: 1px; }
      .sidebar { fill: #005638; }
      
      .badge-warning { fill: #F0C019; rx: 4px; }
      .badge-success { fill: #D4EDDA; rx: 4px; }
      .badge-danger { fill: #F8D7DA; rx: 4px; }
      .badge-text { font-size: 12px; font-weight: 600; text-anchor: middle; alignment-baseline: middle; }
    </style>
  </defs>
