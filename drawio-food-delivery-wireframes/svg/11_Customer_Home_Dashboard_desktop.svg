<svg viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      .font-header { font-family: 'Poppins', sans-serif; font-size: 32px; font-weight: 700; }
      .font-title { font-family: 'Poppins', sans-serif; font-size: 20px; font-weight: 600; }
      .font-body { font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 400; }
      .font-label { font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 600; }
      .font-caption { font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 400; }
      .color-fg { fill: #F7F4EF; }
      .color-bg { fill: #005638; }
      .color-text-dark { fill: #3B2A1A; }
      .color-text-light { fill: #757575; }
      .color-accent { fill: #DC4024; }
      .color-accent-alt { fill: #F0C019; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" fill="#F7F4EF"/>

  <!-- Header Navigation -->
  <rect width="1440" height="72" fill="#005638"/>
  
  <!-- Logo -->
  <text x="48" y="50" class="font-header color-fg">KY Delivery</text>
  
  <!-- Search Bar -->
  <g transform="translate(400, 20)">
    <rect width="420" height="52" rx="8" fill="rgba(255,255,255,0.15)"/>
    <text x="24" y="36" class="font-body color-fg" opacity="0.8">Search restaurants, dishes...</text>
  </g>
  
  <!-- Header Actions -->
  <g transform="translate(1300, 18)">
    <circle cx="0" cy="0" r="28" fill="rgba(255,255,255,0.2)"/>
    <text y="6" class="font-label color-fg" text-anchor="middle">🔔</text>
    
    <circle cx="64" cy="0" r="28" fill="rgba(255,255,255,0.2)"/>
    <text x="64" y="6" class="font-label color-fg" text-anchor="middle">👤</text>
  </g>

  <!-- Main Content -->
  <g transform="translate(48, 88)">
    <!-- Left Sidebar -->
    <g>
      <!-- Delivery Address -->
      <rect width="280" height="140" rx="12" fill="#FFF" stroke="#E0E0E0" stroke-width="1"/>
      <text x="20" y="28" class="font-label color-text-light">DELIVERING TO</text>
      <text x="20" y="64" class="font-title color-text-dark">123 Main Street</text>
      <text x="20" y="88" class="font-caption color-text-light">San Francisco, CA 94102</text>
      <text x="20" y="112" class="font-caption color-accent" font-weight="600">Change Address</text>
      
      <!-- Vertical Filters -->
      <g transform="translate(0, 160)">
        <text y="0" class="font-title color-text-dark">Filters</text>
        
        <g transform="translate(0, 32)">
          <rect width="100" height="40" rx="6" fill="#005638"/>
          <text x="50" y="28" class="font-label color-fg" text-anchor="middle">Popular</text>
        </g>
        
        <g transform="translate(0, 84)">
          <rect width="100" height="40" rx="6" fill="#F7F4EF" stroke="#E0E0E0" stroke-width="1"/>
          <text x="50" y="28" class="font-label color-text-dark" text-anchor="middle">Rating</text>
        </g>
        
        <g transform="translate(0, 136)">
          <rect width="100" height="40" rx="6" fill="#F7F4EF" stroke="#E0E0E0" stroke-width="1"/>
          <text x="50" y="28" class="font-label color-text-dark" text-anchor="middle">Fastest</text>
        </g>
      </g>
    </g>
    
    <!-- Main Content Area -->
    <g transform="translate(320, 0)">
      <!-- Featured Banner -->
      <rect width="1040" height="160" rx="12" fill="#005638"/>
      <rect width="1040" height="160" rx="12" fill="#F0C019" opacity="0.2"/>
      
      <text x="40" y="52" class="font-header color-fg">New User Special!</text>
      <text x="40" y="92" class="font-body" fill="rgba(247,244,239,0.95)">Get 50% off your first order</text>
      <text x="40" y="120" class="font-title color-accent-alt">Code: WELCOME50 — Limited time</text>
      
      <rect x="880" y="112" width="120" height="48" rx="6" fill="#F0C019"/>
      <text x="940" y="142" class="font-label color-bg" text-anchor="middle">Claim Offer</text>
      
      <!-- Restaurant Grid (4 columns) -->
      <g transform="translate(0, 180)">
        <text y="0" class="font-header color-text-dark">Popular Restaurants</text>
        
        <!-- Card 1 -->
        <g transform="translate(0, 40)">
          <rect width="240" height="280" rx="12" fill="#FFF" stroke="#E0E0E0" stroke-width="1"/>
          <rect x="0" y="0" width="240" height="160" rx="12" fill="#E8D7B5"/>
          <text x="120" y="85" class="font-caption color-text-light" text-anchor="middle">Image</text>
          
          <text x="16" y="196" class="font-title color-text-dark">Gourmet Pizza</text>
          <text x="16" y="220" class="font-caption color-text-light">Italian • Pizza</text>
          <text x="16" y="248" class="font-caption color-text-light">★ 4.8 • 20 min</text>
          <text x="16" y="268" class="font-label color-text-light">Delivery: $2.99</text>
          
          <!-- Favorite -->
          <circle cx="208" cy="28" r="24" fill="#FFF" stroke="#E0E0E0" stroke-width="1"/>
          <text x="208" y="34" class="font-label color-accent" text-anchor="middle">♡</text>
        </g>
        
        <!-- Card 2 -->
        <g transform="translate(260, 40)">
          <rect width="240" height="280" rx="12" fill="#FFF" stroke="#E0E0E0" stroke-width="1"/>
          <rect x="0" y="0" width="240" height="160" rx="12" fill="#E8D7B5"/>
          <text x="120" y="85" class="font-caption color-text-light" text-anchor="middle">Image</text>
          
          <text x="16" y="196" class="font-title color-text-dark">Spice Kitchen</text>
          <text x="16" y="220" class="font-caption color-text-light">Indian • Curry</text>
          <text x="16" y="248" class="font-caption color-text-light">★ 4.6 • 25 min</text>
          <text x="16" y="268" class="font-label color-text-light">Delivery: $3.49</text>
          
          <!-- Favorite -->
          <circle cx="208" cy="28" r="24" fill="#FFF" stroke="#E0E0E0" stroke-width="1"/>
          <text x="208" y="34" class="font-label color-accent" text-anchor="middle">♡</text>
          
          <!-- Badge -->
          <rect x="16" y="236" width="50" height="24" rx="4" fill="#F03919"/>
          <text x="41" y="252" class="font-label color-fg" text-anchor="middle">Hot</text>
        </g>
        
        <!-- Card 3 -->
        <g transform="translate(520, 40)">
          <rect width="240" height="280" rx="12" fill="#FFF" stroke="#E0E0E0" stroke-width="1"/>
          <rect x="0" y="0" width="240" height="160" rx="12" fill="#E8D7B5"/>
          <text x="120" y="85" class="font-caption color-text-light" text-anchor="middle">Image</text>
          
          <text x="16" y="196" class="font-title color-text-dark">Sushi Paradise</text>
          <text x="16" y="220" class="font-caption color-text-light">Japanese • Sushi</text>
          <text x="16" y="248" class="font-caption color-text-light">★ 4.9 • 30 min</text>
          <text x="16" y="268" class="font-label color-text-light">Delivery: $4.99</text>
          
          <!-- Favorite -->
          <circle cx="208" cy="28" r="24" fill="#FFF" stroke="#E0E0E0" stroke-width="1"/>
          <text x="208" y="34" class="font-label color-accent" text-anchor="middle">♡</text>
        </g>
        
        <!-- Card 4 -->
        <g transform="translate(780, 40)">
          <rect width="240" height="280" rx="12" fill="#FFF" stroke="#E0E0E0" stroke-width="1"/>
          <rect x="0" y="0" width="240" height="160" rx="12" fill="#E8D7B5"/>
          <text x="120" y="85" class="font-caption color-text-light" text-anchor="middle">Image</text>
          
          <text x="16" y="196" class="font-title color-text-dark">Burger Station</text>
          <text x="16" y="220" class="font-caption color-text-light">American • Burgers</text>
          <text x="16" y="248" class="font-caption color-text-light">★ 4.5 • 15 min</text>
          <text x="16" y="268" class="font-label color-text-light">Delivery: $1.99</text>
          
          <!-- Favorite -->
          <circle cx="208" cy="28" r="24" fill="#FFF" stroke="#E0E0E0" stroke-width="1"/>
          <text x="208" y="34" class="font-label color-accent" text-anchor="middle">♡</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <rect y="860" width="1440" height="40" fill="#3B2A1A"/>
  <text x="48" y="883" class="font-caption color-fg">© 2025 KY Food Delivery. All rights reserved.</text>
</svg>
