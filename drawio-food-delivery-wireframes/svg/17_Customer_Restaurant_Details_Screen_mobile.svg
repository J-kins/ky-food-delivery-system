<svg viewBox="0 0 375 812" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-header { font-family: 'Poppins', sans-serif; font-size: 20px; font-weight: 600; }
      .font-title { font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 600; }
      .font-body { font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 400; }
      .font-label { font-family: 'Poppins', sans-serif; font-size: 12px; font-weight: 600; }
      .font-caption { font-family: 'Poppins', sans-serif; font-size: 12px; font-weight: 400; }
      .color-text-dark { fill: #3B2A1A; }
      .color-text-light { fill: #757575; }
      .color-accent { fill: #DC4024; }
    </style>
  </defs>

  <rect width="375" height="812" fill="#F7F4EF"/>
  
  <!-- Header Image -->
  <rect width="375" height="200" fill="#E8D7B5"/>
  <text x="187.5" y="105" class="font-header" text-anchor="middle" fill="#3B2A1A">🍕</text>
  
  <!-- Back Button -->
  <circle cx="24" cy="32" r="20" fill="#FFF" opacity="0.9"/>
  <text x="24" y="40" class="font-label" text-anchor="middle">←</text>
  
  <!-- Favorite Button -->
  <circle cx="351" cy="32" r="20" fill="#FFF" opacity="0.9"/>
  <text x="351" y="38" class="font-label color-accent" text-anchor="middle">♡</text>

  <!-- Restaurant Info -->
  <g transform="translate(16, 216)">
    <text class="font-header color-text-dark">Trattoria Bella</text>
    <text x="0" y="28" class="font-caption color-text-light">Italian • Fine Dining</text>
    
    <!-- Stats -->
    <g transform="translate(0, 48)">
      <text class="font-caption color-text-light">★ 4.8 (324 reviews)</text>
      <text x="140" class="font-caption color-text-light">20 min delivery</text>
      <text x="240" class="font-caption color-text-light">$2.99</text>
    </g>
    
    <!-- Description -->
    <text x="0" y="80" class="font-caption color-text-light" font-size="13">Premium Italian cuisine with fresh ingredients, handmade pasta, and authentic recipes.</text>
  </g>

  <!-- Menu Tabs -->
  <g transform="translate(0, 356)">
    <rect width="187.5" height="48" fill="none" stroke-bottom="4px solid #DC4024"/>
    <text x="93.75" y="32" class="font-label color-accent" text-anchor="middle">Popular</text>
    
    <rect x="187.5" width="187.5" height="48" fill="none"/>
    <text x="281.25" y="32" class="font-label color-text-light" text-anchor="middle">Reviews</text>
  </g>

  <!-- Menu Items -->
  <g transform="translate(16, 408)">
    <!-- Item 1 -->
    <g>
      <rect width="343" height="100" rx="8" fill="#FFF" stroke="#E0E0E0" stroke-width="1"/>
      <rect x="8" y="8" width="80" height="84" rx="6" fill="#E8D7B5"/>
      <text x="100" y="28" class="font-title color-text-dark">Margherita Pizza</text>
      <text x="100" y="48" class="font-caption color-text-light">Fresh mozzarella, basil</text>
      <text x="100" y="72" class="font-label color-accent">$12.99</text>
      <text x="320" y="50" class="font-header color-text-light" text-anchor="middle">+</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 116)">
      <rect width="343" height="100" rx="8" fill="#FFF" stroke="#E0E0E0" stroke-width="1"/>
      <rect x="8" y="8" width="80" height="84" rx="6" fill="#E8D7B5"/>
      <text x="100" y="28" class="font-title color-text-dark">Carbonara Pasta</text>
      <text x="100" y="48" class="font-caption color-text-light">Guanciale, pecorino</text>
      <text x="100" y="72" class="font-label color-accent">$14.99</text>
      <text x="320" y="50" class="font-header color-text-light" text-anchor="middle">+</text>
    </g>
  </g>

  <!-- Bottom Navigation -->
  <g transform="translate(0, 756)">
    <rect width="375" height="56" fill="#F7F4EF" stroke="#E0E0E0" stroke-width="1"/>
    <g transform="translate(42.75, 8)">
      <text class="font-label color-text-light" text-anchor="middle">🏠</text>
      <text y="28" class="font-label color-text-light" text-anchor="middle">Home</text>
    </g>
    <g transform="translate(123.75, 8)">
      <text class="font-label color-text-light" text-anchor="middle">🔍</text>
      <text y="28" class="font-label color-text-light" text-anchor="middle">Search</text>
    </g>
    <g transform="translate(204.75, 8)">
      <text class="font-label color-text-light" text-anchor="middle">📦</text>
      <text y="28" class="font-label color-text-light" text-anchor="middle">Orders</text>
    </g>
    <g transform="translate(285.75, 8)">
      <text class="font-label color-text-light" text-anchor="middle">👤</text>
      <text y="28" class="font-label color-text-light" text-anchor="middle">Account</text>
    </g>
  </g>
</svg>
