<svg viewBox="0 0 768 1024" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      .font-header { font-family: 'Poppins', sans-serif; font-size: 28px; font-weight: 600; }
      .font-title { font-family: 'Poppins', sans-serif; font-size: 18px; font-weight: 600; }
      .font-body { font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 400; }
      .font-label { font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 600; }
      .font-caption { font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 400; }
      .color-fg { fill: #F7F4EF; }
      .color-bg { fill: #005638; }
      .color-text-dark { fill: #3B2A1A; }
      .color-text-light { fill: #757575; }
      .color-accent { fill: #DC4024; }
      .color-accent-alt { fill: #F0C019; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="768" height="1024" fill="#F7F4EF"/>

  <!-- Top Navigation Bar -->
  <rect width="768" height="64" fill="#005638"/>
  
  <!-- Logo / Brand -->
  <text x="32" y="44" class="font-header color-fg">KY Delivery</text>
  
  <!-- Search Bar in Header -->
  <g transform="translate(400, 20)">
    <rect width="320" height="44" rx="8" fill="rgba(255,255,255,0.15)"/>
    <text x="20" y="30" class="font-body color-fg" opacity="0.7">Search restaurants...</text>
  </g>
  
  <!-- Notification Icon -->
  <circle cx="720" cy="32" r="22" fill="rgba(255,255,255,0.2)"/>
  <text x="720" y="38" class="font-label color-fg" text-anchor="middle">🔔</text>

  <!-- Content Area with Sidebar -->
  <g transform="translate(24, 80)">
    <!-- Left Sidebar -->
    <g>
      <!-- Delivery Address -->
      <rect width="200" height="120" rx="12" fill="#FFF" stroke="#E0E0E0" stroke-width="1"/>
      <text x="16" y="28" class="font-label color-text-light">DELIVERING TO</text>
      <text x="16" y="56" class="font-title color-text-dark">123 Main St</text>
      <text x="16" y="80" class="font-caption color-text-light">San Francisco, CA</text>
      <text x="16" y="100" class="font-caption color-accent">Change Address</text>
      
      <!-- Filters -->
      <g transform="translate(0, 140)">
        <text y="0" class="font-label color-text-dark">Filters</text>
        
        <!-- Filter Chips (vertical) -->
        <rect x="0" y="20" width="90" height="36" rx="4" fill="#005638"/>
        <text x="45" y="42" class="font-label color-fg" text-anchor="middle">Popular</text>
        
        <rect x="0" y="64" width="90" height="36" rx="4" fill="#F7F4EF" stroke="#E0E0E0" stroke-width="1"/>
        <text x="45" y="86" class="font-label color-text-dark" text-anchor="middle">Rating</text>
        
        <rect x="0" y="108" width="90" height="36" rx="4" fill="#F7F4EF" stroke="#E0E0E0" stroke-width="1"/>
        <text x="45" y="130" class="font-label color-text-dark" text-anchor="middle">Fastest</text>
        
        <rect x="0" y="152" width="90" height="36" rx="4" fill="#F7F4EF" stroke="#E0E0E0" stroke-width="1"/>
        <text x="45" y="174" class="font-label color-text-dark" text-anchor="middle">Price Low</text>
      </g>
    </g>
    
    <!-- Main Content Area -->
    <g transform="translate(224, 0)">
      <!-- Promo Banner -->
      <rect width="520" height="140" rx="12" fill="#005638"/>
      <rect width="520" height="140" rx="12" fill="#F0C019" opacity="0.15"/>
      
      <text x="32" y="44" class="font-header color-fg">New User Special!</text>
      <text x="32" y="76" class="font-body" fill="rgba(247,244,239,0.9)">Get 50% off your first order with code</text>
      <text x="32" y="104" class="font-title color-accent-alt">WELCOME50</text>
      
      <!-- CTA Button -->
      <rect x="400" y="100" width="100" height="40" rx="6" fill="#F0C019"/>
      <text x="450" y="124" class="font-label color-bg" text-anchor="middle">Claim Offer</text>
      
      <!-- Restaurant Grid (2 columns) -->
      <g transform="translate(0, 160)">
        <text y="0" class="font-header color-text-dark">Popular Restaurants</text>
        
        <!-- Card Row 1 -->
        <g transform="translate(0, 40)">
          <!-- Card 1 -->
          <rect width="248" height="240" rx="12" fill="#FFF" stroke="#E0E0E0" stroke-width="1"/>
          <rect x="0" y="0" width="248" height="140" rx="12" fill="#E8D7B5"/>
          <text x="124" y="75" class="font-caption color-text-light" text-anchor="middle">Image</text>
          <text x="16" y="168" class="font-title color-text-dark">Gourmet Pizza</text>
          <text x="16" y="188" class="font-caption color-text-light">Italian • Pizza</text>
          <text x="16" y="220" class="font-caption color-text-light">★ 4.8 • 20 min</text>
          
          <!-- Favorite -->
          <circle cx="216" cy="20" r="20" fill="#FFF" stroke="#E0E0E0" stroke-width="1"/>
          <text x="216" y="26" class="font-label color-accent" text-anchor="middle">♡</text>
          
          <!-- Badge -->
          <rect x="16" y="208" width="60" height="24" rx="4" fill="#F0C019"/>
          <text x="46" y="224" class="font-label color-bg" text-anchor="middle">Popular</text>
        </g>
        
        <!-- Card 2 -->
        <g transform="translate(268, 40)">
          <rect width="248" height="240" rx="12" fill="#FFF" stroke="#E0E0E0" stroke-width="1"/>
          <rect x="0" y="0" width="248" height="140" rx="12" fill="#E8D7B5"/>
          <text x="124" y="75" class="font-caption color-text-light" text-anchor="middle">Image</text>
          <text x="16" y="168" class="font-title color-text-dark">Spice Kitchen</text>
          <text x="16" y="188" class="font-caption color-text-light">Indian • Curry</text>
          <text x="16" y="220" class="font-caption color-text-light">★ 4.6 • 25 min</text>
          
          <!-- Favorite -->
          <circle cx="216" cy="20" r="20" fill="#FFF" stroke="#E0E0E0" stroke-width="1"/>
          <text x="216" y="26" class="font-label color-accent" text-anchor="middle">♡</text>
          
          <!-- Badge -->
          <rect x="16" y="208" width="60" height="24" rx="4" fill="#F03919"/>
          <text x="46" y="224" class="font-label color-fg" text-anchor="middle" font-size="12">Hot</text>
        </g>
        
        <!-- Card Row 2 -->
        <g transform="translate(0, 300)">
          <!-- Card 3 -->
          <rect width="248" height="240" rx="12" fill="#FFF" stroke="#E0E0E0" stroke-width="1"/>
          <rect x="0" y="0" width="248" height="140" rx="12" fill="#E8D7B5"/>
          <text x="124" y="75" class="font-caption color-text-light" text-anchor="middle">Image</text>
          <text x="16" y="168" class="font-title color-text-dark">Sushi Paradise</text>
          <text x="16" y="188" class="font-caption color-text-light">Japanese • Sushi</text>
          <text x="16" y="220" class="font-caption color-text-light">★ 4.9 • 30 min</text>
          
          <!-- Favorite -->
          <circle cx="216" cy="20" r="20" fill="#FFF" stroke="#E0E0E0" stroke-width="1"/>
          <text x="216" y="26" class="font-label color-accent" text-anchor="middle">♡</text>
        </g>
        
        <!-- Card 4 -->
        <g transform="translate(268, 300)">
          <rect width="248" height="240" rx="12" fill="#FFF" stroke="#E0E0E0" stroke-width="1"/>
          <rect x="0" y="0" width="248" height="140" rx="12" fill="#E8D7B5"/>
          <text x="124" y="75" class="font-caption color-text-light" text-anchor="middle">Image</text>
          <text x="16" y="168" class="font-title color-text-dark">Burger Station</text>
          <text x="16" y="188" class="font-caption color-text-light">American • Burgers</text>
          <text x="16" y="220" class="font-caption color-text-light">★ 4.5 • 15 min</text>
          
          <!-- Favorite -->
          <circle cx="216" cy="20" r="20" fill="#FFF" stroke="#E0E0E0" stroke-width="1"/>
          <text x="216" y="26" class="font-label color-accent" text-anchor="middle">♡</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Navigation (Horizontal) -->
  <g transform="translate(0, 968)">
    <rect width="768" height="56" fill="#F7F4EF" stroke="#E0E0E0" stroke-width="1"/>
    
    <!-- Navigation Items -->
    <g transform="translate(96, 8)">
      <!-- Home -->
      <text x="0" y="20" class="font-title color-accent">🏠 Home</text>
      
      <!-- Search -->
      <text x="160" y="20" class="font-title color-text-light">🔍 Search</text>
      
      <!-- Orders -->
      <text x="320" y="20" class="font-title color-text-light">📦 Orders</text>
      
      <!-- Account -->
      <text x="480" y="20" class="font-title color-text-light">👤 Account</text>
    </g>
  </g>
</svg>
