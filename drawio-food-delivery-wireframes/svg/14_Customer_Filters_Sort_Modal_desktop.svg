<svg viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-header { font-family: 'Poppins', sans-serif; font-size: 28px; font-weight: 600; }
      .font-title { font-family: 'Poppins', sans-serif; font-size: 18px; font-weight: 600; }
      .font-body { font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 400; }
      .font-label { font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#F7F4EF"/>
  <rect width="1440" height="900" fill="#000" opacity="0.5"/>
  
  <g transform="translate(300, 150)">
    <rect width="840" height="600" rx="16" fill="#F7F4EF"/>
    
    <g transform="translate(32, 32)">
      <text class="font-header" fill="#3B2A1A">Filters & Sort</text>
      <text x="776" y="18" class="font-label" text-anchor="end" fill="#3B2A1A">✕</text>
    </g>
    
    <line x1="32" y1="80" x2="808" y2="80" stroke="#E0E0E0" stroke-width="1"/>
    
    <!-- Left Column -->
    <g transform="translate(32, 104)">
      <text class="font-title" fill="#3B2A1A">Sort By</text>
      
      <g transform="translate(0, 48)">
        <circle cx="10" cy="10" r="6" fill="#005638"/>
        <text x="28" y="14" class="font-body" fill="#3B2A1A">Most Popular</text>
      </g>
      
      <g transform="translate(0, 88)">
        <circle cx="10" cy="10" r="6" fill="none" stroke="#E0E0E0" stroke-width="1"/>
        <text x="28" y="14" class="font-body" fill="#3B2A1A">Highest Rating</text>
      </g>
      
      <g transform="translate(0, 128)">
        <circle cx="10" cy="10" r="6" fill="none" stroke="#E0E0E0" stroke-width="1"/>
        <text x="28" y="14" class="font-body" fill="#3B2A1A">Fastest Delivery</text>
      </g>
      
      <g transform="translate(0, 168)">
        <circle cx="10" cy="10" r="6" fill="none" stroke="#E0E0E0" stroke-width="1"/>
        <text x="28" y="14" class="font-body" fill="#3B2A1A">Lowest Price</text>
      </g>
    </g>
    
    <!-- Right Column -->
    <g transform="translate(400, 104)">
      <text class="font-title" fill="#3B2A1A">Cuisine</text>
      
      <g transform="translate(0, 48)">
        <rect width="18" height="18" rx="2" fill="#005638"/>
        <text x="28" y="14" class="font-body" fill="#3B2A1A">Italian</text>
      </g>
      
      <g transform="translate(0, 88)">
        <rect width="18" height="18" rx="2" fill="none" stroke="#E0E0E0" stroke-width="1"/>
        <text x="28" y="14" class="font-body" fill="#3B2A1A">Indian</text>
      </g>
      
      <g transform="translate(0, 128)">
        <rect width="18" height="18" rx="2" fill="#005638"/>
        <text x="28" y="14" class="font-body" fill="#3B2A1A">Japanese</text>
      </g>
      
      <g transform="translate(0, 168)">
        <rect width="18" height="18" rx="2" fill="none" stroke="#E0E0E0" stroke-width="1"/>
        <text x="28" y="14" class="font-body" fill="#3B2A1A">Mexican</text>
      </g>
    </g>
    
    <line x1="32" y1="348" x2="808" y2="348" stroke="#E0E0E0" stroke-width="1"/>
    
    <!-- Action Buttons -->
    <g transform="translate(32, 372)">
      <rect width="776" height="56" rx="8" fill="#F7F4EF" stroke="#E0E0E0" stroke-width="1"/>
      <text x="388" y="36" class="font-label" fill="#3B2A1A" text-anchor="middle">Reset Filters</text>
    </g>
    
    <g transform="translate(32, 444)">
      <rect width="776" height="56" rx="8" fill="#005638"/>
      <text x="388" y="36" class="font-label" fill="#F7F4EF" text-anchor="middle">Apply Filters</text>
    </g>
  </g>
</svg>
