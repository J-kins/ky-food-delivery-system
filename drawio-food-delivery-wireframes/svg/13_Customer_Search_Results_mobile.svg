<svg viewBox="0 0 375 812" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-header { font-family: 'Poppins', sans-serif; font-size: 18px; font-weight: 600; }
      .font-title { font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 600; }
      .font-body { font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 400; }
      .font-label { font-family: 'Poppins', sans-serif; font-size: 12px; font-weight: 600; }
      .font-caption { font-family: 'Poppins', sans-serif; font-size: 12px; font-weight: 400; }
      .color-fg { fill: #F7F4EF; }
      .color-bg { fill: #005638; }
      .color-text-dark { fill: #3B2A1A; }
      .color-text-light { fill: #757575; }
      .color-accent { fill: #DC4024; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="375" height="812" fill="#F7F4EF"/>

  <!-- Header -->
  <rect width="375" height="56" fill="#005638"/>
  <g transform="translate(16, 20)">
    <text class="font-label color-fg">← Pizza</text>
  </g>
  <rect width="375" height="20" fill="#005638"/>

  <!-- Search Bar -->
  <g transform="translate(16, 72)">
    <rect width="343" height="44" rx="8" fill="#FFF" stroke="#E0E0E0" stroke-width="1"/>
    <text x="16" y="28" class="font-body color-text-light">Pizza</text>
    <text x="319" y="28" class="font-label" text-anchor="middle">×</text>
  </g>

  <!-- Filters Chips -->
  <g transform="translate(16, 124)">
    <rect x="0" width="100" height="32" rx="16" fill="#005638"/>
    <text x="50" y="22" class="font-label color-fg" text-anchor="middle">All</text>
    
    <rect x="110" width="100" height="32" rx="16" fill="#F7F4EF" stroke="#E0E0E0" stroke-width="1"/>
    <text x="160" y="22" class="font-label color-text-dark" text-anchor="middle">Rating</text>
    
    <rect x="220" width="110" height="32" rx="16" fill="#F7F4EF" stroke="#E0E0E0" stroke-width="1"/>
    <text x="275" y="22" class="font-label color-text-dark" text-anchor="middle">Delivery</text>
  </g>

  <!-- Results Count -->
  <g transform="translate(16, 164)">
    <text class="font-caption color-text-light">Found 24 results for "Pizza"</text>
  </g>

  <!-- Result Items -->
  <g transform="translate(16, 184)">
    <!-- Result 1 -->
    <g>
      <rect width="343" height="100" rx="8" fill="#FFF" stroke="#E0E0E0" stroke-width="1"/>
      
      <!-- Image -->
      <rect x="8" y="8" width="84" height="84" rx="6" fill="#E8D7B5"/>
      <text x="50" y="55" class="font-caption color-text-light" text-anchor="middle">🍕</text>
      
      <!-- Content -->
      <text x="104" y="28" class="font-title color-text-dark">Gourmet Pizza Co.</text>
      <text x="104" y="48" class="font-caption color-text-light">Italian • Pizza</text>
      <text x="104" y="68" class="font-caption color-text-light">★ 4.8 • 20 min • $2.99</text>
      
      <!-- Favorite -->
      <text x="323" y="28" class="font-label color-accent">♡</text>
    </g>

    <!-- Result 2 -->
    <g transform="translate(0, 120)">
      <rect width="343" height="100" rx="8" fill="#FFF" stroke="#E0E0E0" stroke-width="1"/>
      
      <!-- Image -->
      <rect x="8" y="8" width="84" height="84" rx="6" fill="#E8D7B5"/>
      <text x="50" y="55" class="font-caption color-text-light" text-anchor="middle">🍕</text>
      
      <!-- Content -->
      <text x="104" y="28" class="font-title color-text-dark">New York Pizza</text>
      <text x="104" y="48" class="font-caption color-text-light">Pizza • Fast Food</text>
      <text x="104" y="68" class="font-caption color-text-light">★ 4.5 • 15 min • $1.99</text>
      
      <!-- Favorite -->
      <text x="323" y="28" class="font-label color-accent">♡</text>
    </g>

    <!-- Result 3 -->
    <g transform="translate(0, 240)">
      <rect width="343" height="100" rx="8" fill="#FFF" stroke="#E0E0E0" stroke-width="1"/>
      
      <!-- Image -->
      <rect x="8" y="8" width="84" height="84" rx="6" fill="#E8D7B5"/>
      <text x="50" y="55" class="font-caption color-text-light" text-anchor="middle">🍕</text>
      
      <!-- Content -->
      <text x="104" y="28" class="font-title color-text-dark">Wood Fired Pizzeria</text>
      <text x="104" y="48" class="font-caption color-text-light">Italian • Pizza</text>
      <text x="104" y="68" class="font-caption color-text-light">★ 4.9 • 25 min • $3.99</text>
      
      <!-- Favorite -->
      <text x="323" y="28" class="font-label color-accent">♡</text>
    </g>

    <!-- Result 4 -->
    <g transform="translate(0, 360)">
      <rect width="343" height="100" rx="8" fill="#FFF" stroke="#E0E0E0" stroke-width="1"/>
      
      <!-- Image -->
      <rect x="8" y="8" width="84" height="84" rx="6" fill="#E8D7B5"/>
      <text x="50" y="55" class="font-caption color-text-light" text-anchor="middle">🍕</text>
      
      <!-- Content -->
      <text x="104" y="28" class="font-title color-text-dark">Pizza Express</text>
      <text x="104" y="48" class="font-caption color-text-light">Fast Food • Pizza</text>
      <text x="104" y="68" class="font-caption color-text-light">★ 4.3 • 20 min • $1.49</text>
      
      <!-- Favorite -->
      <text x="323" y="28" class="font-label color-accent">♡</text>
    </g>
  </g>

  <!-- Bottom Navigation -->
  <g transform="translate(0, 756)">
    <rect width="375" height="56" fill="#F7F4EF" stroke="#E0E0E0" stroke-width="1"/>
    <g transform="translate(42.75, 8)">
      <text class="font-label color-text-light" text-anchor="middle">🏠</text>
      <text y="28" class="font-label color-text-light" text-anchor="middle">Home</text>
    </g>
    <g transform="translate(123.75, 8)">
      <text class="font-label color-accent" text-anchor="middle">🔍</text>
      <text y="28" class="font-label color-accent" text-anchor="middle">Search</text>
    </g>
    <g transform="translate(204.75, 8)">
      <text class="font-label color-text-light" text-anchor="middle">📦</text>
      <text y="28" class="font-label color-text-light" text-anchor="middle">Orders</text>
    </g>
    <g transform="translate(285.75, 8)">
      <text class="font-label color-text-light" text-anchor="middle">👤</text>
      <text y="28" class="font-label color-text-light" text-anchor="middle">Account</text>
    </g>
  </g>
</svg>
