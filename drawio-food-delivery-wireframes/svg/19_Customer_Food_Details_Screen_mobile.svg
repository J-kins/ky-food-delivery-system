<svg viewBox="0 0 375 812" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-header { font-family: 'Poppins', sans-serif; font-size: 20px; font-weight: 600; }
      .font-title { font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 600; }
      .font-body { font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 400; }
      .font-label { font-family: 'Poppins', sans-serif; font-size: 12px; font-weight: 600; }
      .font-caption { font-family: 'Poppins', sans-serif; font-size: 12px; font-weight: 400; }
      .color-text-dark { fill: #3B2A1A; }
      .color-text-light { fill: #757575; }
      .color-accent { fill: #DC4024; }
    </style>
  </defs>

  <rect width="375" height="812" fill="#F7F4EF"/>
  
  <!-- Header -->
  <rect width="375" height="60" fill="#005638"/>
  <text x="16" y="40" class="font-label" fill="#F7F4EF">← Back</text>
  <rect width="375" height="20" fill="#005638"/>

  <!-- Product Image -->
  <rect y="60" width="375" height="200" fill="#E8D7B5"/>
  <text x="187.5" y="165" class="font-header" text-anchor="middle" fill="#3B2A1A">🍕</text>

  <!-- Product Details -->
  <g transform="translate(16, 272)">
    <text class="font-header color-text-dark">Margherita Pizza</text>
    <text x="0" y="28" class="font-caption color-text-light">Fresh mozzarella, tomato, basil</text>
    
    <!-- Price & Rating -->
    <g transform="translate(0, 48)">
      <text class="font-title color-accent">$12.99</text>
      <text x="120" class="font-caption color-text-light">★ 4.8 (52 ratings)</text>
    </g>

    <!-- Description -->
    <text x="0" y="80" class="font-caption color-text-light">Traditional Italian pizza with authentic mozzarella, fresh tomatoes, and basil on crispy dough.</text>
    
    <!-- Customization -->
    <g transform="translate(0, 120)">
      <text class="font-title color-text-dark">Customize</text>
      
      <g transform="translate(0, 32)">
        <text class="font-label color-text-dark">Size</text>
        <g transform="translate(0, 24)">
          <rect width="100" height="36" rx="6" fill="#005638"/>
          <text x="50" y="23" class="font-label" fill="#F7F4EF" text-anchor="middle">Small (10")</text>
        </g>
        <g transform="translate(110, 24)">
          <rect width="100" height="36" rx="6" fill="#F7F4EF" stroke="#E0E0E0" stroke-width="1"/>
          <text x="50" y="23" class="font-label color-text-dark" text-anchor="middle">Large (14")</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Quantity & Add -->
  <g transform="translate(16, 680)">
    <!-- Quantity Selector -->
    <g>
      <rect width="80" height="48" rx="8" fill="#FFF" stroke="#E0E0E0" stroke-width="1"/>
      <text x="16" y="24" class="font-label color-text-light">−</text>
      <text x="40" y="32" class="font-title color-text-dark" text-anchor="middle">1</text>
      <text x="64" y="24" class="font-label color-text-light">+</text>
    </g>
    
    <!-- Add to Cart Button -->
    <rect x="96" width="247" height="48" rx="8" fill="#005638"/>
    <text x="219.5" y="32" class="font-label" fill="#F7F4EF" text-anchor="middle">ADD TO CART • $12.99</text>
  </g>

  <!-- Bottom Navigation -->
  <g transform="translate(0, 756)">
    <rect width="375" height="56" fill="#F7F4EF" stroke="#E0E0E0" stroke-width="1"/>
    <g transform="translate(42.75, 8)">
      <text class="font-label color-text-light" text-anchor="middle">🏠</text>
      <text y="28" class="font-label color-text-light" text-anchor="middle">Home</text>
    </g>
    <g transform="translate(123.75, 8)">
      <text class="font-label color-text-light" text-anchor="middle">🔍</text>
      <text y="28" class="font-label color-text-light" text-anchor="middle">Search</text>
    </g>
    <g transform="translate(204.75, 8)">
      <text class="font-label color-text-light" text-anchor="middle">📦</text>
      <text y="28" class="font-label color-text-light" text-anchor="middle">Orders</text>
    </g>
    <g transform="translate(285.75, 8)">
      <text class="font-label color-text-light" text-anchor="middle">👤</text>
      <text y="28" class="font-label color-text-light" text-anchor="middle">Account</text>
    </g>
  </g>
</svg>
